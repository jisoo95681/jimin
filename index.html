<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CFA Quiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e4f6f6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=13">
<title>CFA Level 2 Quiz</title>
<style>
  /* Palette: navy #292645, white, pale aqua #e4f6f6, aqua #bbe9e9, steel blue #2f678e. */
  :root {
    --navy: #292645; --blue: #2f678e; --aqua: #bbe9e9; --aqua-pale: #e4f6f6; --white: #fff;
    --bg: var(--aqua-pale); --card: var(--white); --border: #cfe6ea;
    --text: var(--navy); --muted: #5f6a84; --accent: var(--blue); --accent-soft: rgba(47, 103, 142, .08);
    --good: #1d8468; --bad: #c2453d; --good-bg: #e2f4ec; --bad-bg: #fbe8e6;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --ease: cubic-bezier(.22, .61, .36, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* No double-tap zoom anywhere in the app. */
  html, body, button, input, label { touch-action: manipulation; }
  html { background: var(--bg); overflow-x: hidden; overscroll-behavior: none; }
  body { overscroll-behavior: none; } /* no rubber-band bounce or sideways drift of the whole page */
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(70% 30% at 85% 0%, rgba(187, 233, 233, .9), transparent 70%),
      linear-gradient(180deg, var(--aqua-pale) 0%, #f2fafa 55%, var(--white) 100%);
  }
  main {
    position: relative; max-width: 720px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }

  /* Header wordmark */
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; cursor: pointer; }
  .brand-cfa { font-family: var(--serif); font-weight: 700; font-size: 2rem; line-height: 1; color: var(--navy); }
  .brand-level { font-weight: 800; font-style: italic; font-size: 1.15rem; color: var(--blue); }
  .brand-sub { color: var(--muted); font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; }
  .glow-line { height: 3px; margin: 14px 0 20px; background: linear-gradient(90deg, var(--navy), var(--blue) 45%, var(--aqua) 80%, transparent); border-radius: 3px; opacity: .85; }

  /* Cards and text */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    box-shadow: 0 1px 2px rgba(41, 38, 69, .05), 0 10px 28px rgba(41, 38, 69, .07);
  }
  .card + .card { margin-top: 14px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
  .meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .q { font-weight: 600; margin: 0 0 16px; white-space: pre-line; }
  .kicker { color: var(--blue); font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 6px; }
  .label { font-size: .8rem; color: var(--muted); margin: 16px 0 8px; letter-spacing: .06em; text-transform: uppercase; }
  .score { font-size: 2.4rem; font-weight: 800; margin: 0 0 4px; color: var(--navy); font-family: var(--serif); }
  [hidden] { display: none !important; }

  /* Buttons */
  .btn {
    padding: 11px 18px; border-radius: 11px; border: 1px solid var(--blue);
    background: var(--blue); color: var(--white); font: inherit; font-weight: 650; cursor: pointer;
    transition: transform .2s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease), opacity .3s;
  }
  .btn:hover:not(:disabled) { background: var(--navy); border-color: var(--navy); box-shadow: 0 6px 18px rgba(41, 38, 69, .2); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.ghost { background: var(--white); color: var(--blue); border-color: rgba(47, 103, 142, .35); }
  .btn.ghost:hover:not(:disabled) { background: var(--aqua-pale); color: var(--navy); border-color: var(--blue); box-shadow: none; }
  .btn.small { padding: 7px 14px; font-size: .9rem; }
  .btn:disabled { opacity: .35; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
  label.check { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
  label.check input { width: 18px; height: 18px; accent-color: var(--blue); }

  /* Navigation on sub-screens */
  .nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .back { background: none; border: 0; color: var(--blue); font: inherit; font-weight: 600; cursor: pointer; padding: 6px 8px 6px 0; transition: opacity .2s; }
  .back:active { opacity: .6; }
  .title { font-size: 1.45rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -.01em; }

  /* Topic list */
  .list { padding: 6px 0; }
  .topic-row {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 18px;
    background: none; border: 0; border-top: 1px solid var(--border); color: var(--text);
    text-align: left; font: inherit; cursor: pointer; transition: background .3s var(--ease);
  }
  .topic-row:first-child { border-top: 0; }
  button.topic-row:hover:not(:disabled) { background: var(--aqua-pale); }
  button.topic-row:active:not(:disabled) { background: var(--aqua); }
  .topic-row:disabled { cursor: default; }
  .topic-row:disabled .name, .topic-row:disabled .num, .topic-row.off .name, .topic-row.off .num { opacity: .4; }
  .num {
    flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: .85rem; background: var(--aqua); color: var(--navy);
  }
  .num.plus { background: var(--navy); color: var(--white); font-size: 1.2rem; }
  .name { font-weight: 600; }
  .cnt { font-size: .82rem; color: var(--muted); }
  .chev { margin-left: auto; color: var(--blue); font-size: 1.3rem; }
  .custom-row { cursor: default; padding-top: 11px; padding-bottom: 11px; }

  /* Custom stepper (tap = 1, hold 1.5s = keeps counting) */
  .stepper { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
  .step {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--white);
    color: var(--navy); font: inherit; font-size: 1.1rem; cursor: pointer;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    transition: background .25s var(--ease), border-color .25s, transform .15s var(--ease);
  }
  .step:active:not(:disabled), .step.holding { transform: scale(.92); background: var(--aqua); border-color: var(--blue); }
  .step:disabled { opacity: .3; cursor: default; }
  .step.all { width: auto; padding: 0 10px; font-size: .78rem; font-weight: 700; color: var(--blue); }
  .val { min-width: 26px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); transition: color .25s; }
  .val.on { color: var(--blue); }
  .sticky {
    position: sticky; bottom: calc(12px + env(safe-area-inset-bottom)); margin-top: 14px;
    background: rgba(255, 255, 255, .9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .total { font-weight: 700; margin: 0; }
  @media (max-width: 480px) {
    .custom-row { gap: 10px; padding-left: 12px; padding-right: 12px; }
    .custom-row .num { width: 26px; height: 26px; font-size: .75rem; }
    .stepper { gap: 4px; }
    .step { width: 30px; height: 30px; }
    .step.all { padding: 0 7px; }
    .val { min-width: 20px; }
  }

  /* Chips */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 18px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--white); color: var(--navy); font: inherit; cursor: pointer;
    transition: background .3s var(--ease), border-color .3s, color .3s, transform .15s var(--ease);
  }
  .chip:active:not(:disabled) { transform: scale(.95); }
  .chip.on { background: var(--blue); border-color: var(--blue); color: var(--white); font-weight: 650; }
  .chip:disabled { opacity: .3; cursor: default; }

  /* Questions */
  .opt {
    display: block; width: 100%; text-align: left; margin: 0 0 10px; padding: 13px 15px;
    background: var(--white); color: var(--text); border: 1px solid var(--border);
    border-radius: 11px; font: inherit; cursor: pointer;
    transition: border-color .3s var(--ease), background .3s var(--ease), transform .15s var(--ease);
  }
  .opt:hover:not(:disabled) { border-color: var(--blue); background: var(--aqua-pale); }
  .opt:active:not(:disabled) { transform: scale(.99); }
  .opt:disabled { cursor: default; }
  .opt.sel { border-color: var(--blue); background: var(--aqua); }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .2em; line-height: 1.15; font-size: .92em; }
  .frac > span { padding: 0 .25em; white-space: nowrap; }
  .frac > span:first-child { border-bottom: 1.5px solid currentColor; padding-bottom: 1px; }
  .frac > span:last-child { padding-top: 1px; }
  .why { white-space: pre-line;
    margin-top: 6px; padding: 12px 14px; border-left: 3px solid var(--blue); border-radius: 0 10px 10px 0;
    background: var(--aqua-pale); font-size: .95rem; animation: fade-up .5s var(--ease);
  }
  .progress { height: 5px; background: var(--aqua); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--navy)); border-radius: 3px; transition: width .5s var(--ease); }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .clocks { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .q-timer { font-weight: 500; color: var(--muted); }
  .q-timer b { color: var(--navy); font-variant-numeric: tabular-nums; }
  .qnav-row { justify-content: space-between; }
  .qmap { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 12px; }
  .qdot { min-width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--white); color: var(--muted); font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; padding: 0 6px; }
  .qdot.done { background: var(--aqua); border-color: var(--aqua); color: var(--navy); }
  .qdot.skip { border-color: #e8b45c; color: #a8742a; background: #fff8ea; }
  .qdot.cur { outline: 2.5px solid var(--navy); outline-offset: 1px; }
  .mark-btn { width: 100%; background: var(--navy); }
  .mark-ask { margin-top: 12px; }
  .opt.static { cursor: default; }
  .review-q .meta .ok { color: var(--good); font-weight: 700; }
  .review-q .meta .bad { color: #c0564b; font-weight: 700; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; color: var(--navy); }
  .status { color: var(--muted); margin: 0; }
  .miss { margin: 12px 0 0; padding-left: 18px; }
  .miss li { margin-bottom: 8px; }

  /* Wrong answers notebook */
  .note { border-top: 1px solid var(--border); padding: 14px 0; }
  .note:first-of-type { border-top: 0; }
  .note .ans { color: var(--good); font-weight: 600; margin: 6px 0; }
  .note .small { color: var(--muted); font-size: .85rem; }
  .link { background: none; border: 0; padding: 0; color: var(--bad); font: inherit; font-size: .85rem; cursor: pointer; margin-left: 8px; }

  /* Vignettes and exhibits */
  .vignette h2 { margin: 0 0 12px; font-size: 1.35rem; font-family: var(--serif); color: var(--navy); }
  .vignette h3 { font-size: 1rem; margin: 18px 0 6px; color: var(--blue); }
  .vignette p { margin: 0 0 12px; }
  .exhibit { margin: 16px 0; }
  .ex-title { font-weight: 600; font-size: .9rem; margin: 0 0 6px !important; }
  .ex-note { font-size: .8rem; color: var(--muted); margin: 6px 0 0 !important; }
  .scroll { overflow-x: auto; overscroll-behavior: none; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  thead th { color: var(--white); background: var(--navy); font-weight: 600; }
  thead th:first-child { border-top-left-radius: 8px; }
  thead th:last-child { border-top-right-radius: 8px; }
  tbody tr:nth-child(even) td { background: rgba(228, 246, 246, .55); }
  .num-cell { text-align: right; font-variant-numeric: tabular-nums; }
  td.num-cell { white-space: nowrap; }
  tr.subhead td { font-weight: 700; color: var(--blue); background: var(--aqua-pale) !important; }
  details { margin: 0 0 14px; }
  details summary { cursor: pointer; color: var(--blue); font-weight: 600; }
  details[open] summary { margin-bottom: 10px; }
  .ver { color: var(--muted); font-size: .75rem; text-align: center; margin-top: 26px; opacity: .7; }

  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; animation: pulse 1.6s ease-in-out infinite; vertical-align: middle; }
  @keyframes pulse { 50% { opacity: .3; transform: scale(.8); } }

  /* Study timer: a full-screen page with just the time and one button.
     Idle = white page, navy button; concentrating = navy page, white button. */
  .focus {
    position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(28px, 6vh, 64px); background: var(--white); color: var(--navy); opacity: 0;
    transition: background 1s var(--ease), color 1s var(--ease), opacity .5s var(--ease);
  }
  .focus.show { opacity: 1; }
  .focus.running { background: var(--navy); color: var(--white); }
  .focus-time { display: flex; justify-content: center; font-size: clamp(4.5rem, 19vw, 11rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1.15; }
  /* Each digit sits in its own slot; when it changes, the old digit slowly fades out in place while the new one fades in. No movement. */
  .slot { position: relative; display: inline-block; }
  .slot .sizer { visibility: hidden; }
  .slot .dg { position: absolute; left: 0; right: 0; top: 0; text-align: center; transition: opacity .8s ease-in-out; }
  .slot .dg.below, .slot .dg.above { opacity: 0; }
  .focus-btn {
    position: relative; width: min(280px, 72vw); height: 76px; border-radius: 999px; border: 0; overflow: hidden; cursor: pointer;
    font: inherit; font-size: 1.3rem; font-weight: 700; letter-spacing: .02em; background: var(--navy); color: var(--white);
    box-shadow: 0 14px 34px rgba(41, 38, 69, .25);
    transition: background 1s var(--ease), color 1s var(--ease), box-shadow 1s var(--ease), transform .25s var(--ease);
  }
  .focus-btn:active { transform: scale(.96); }
  .focus.running .focus-btn { background: var(--white); color: var(--navy); box-shadow: 0 14px 34px rgba(0, 0, 0, .3); }
  .focus-btn .lbl { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity .6s var(--ease), transform .6s var(--ease); }
  .focus-btn .pause { opacity: 0; transform: translateY(70%); }
  .focus.running .focus-btn .go { opacity: 0; transform: translateY(-70%); }
  .focus.running .focus-btn .pause { opacity: 1; transform: none; }
  .focus-close {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
    background: none; border: 0; padding: 10px 12px; font: inherit; font-weight: 600; color: inherit; opacity: .5; cursor: pointer; transition: opacity .3s;
  }
  .focus-close:hover { opacity: .9; }
  .sess { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .sess:first-of-type { border-top: 0; }
  .sess .when { flex: 1; font-variant-numeric: tabular-nums; }
  .sess .dur { font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; }
  .x { background: none; border: 0; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: color .2s, background .2s; }
  .x:hover { color: var(--bad); background: var(--bad-bg); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; background: var(--navy); color: var(--white); padding: 12px 18px; border-radius: 12px; font-weight: 600; box-shadow: 0 12px 30px rgba(41, 38, 69, .3); transition: opacity .4s var(--ease), transform .4s var(--ease); z-index: 70; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Calendar */
  .cal-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .dday-num { font-family: var(--serif); font-size: clamp(2.6rem, 10vw, 3.4rem); font-weight: 700; line-height: 1; color: var(--navy); }
  .dday-sub { color: var(--muted); font-size: .88rem; margin-top: 6px; }
  .month-total { text-align: right; }
  .month-total b { display: block; font-size: 1.4rem; color: var(--blue); }
  @media (max-width: 520px) { .month-total { text-align: left; width: 100%; border-top: 1px solid var(--border); padding-top: 12px; } }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--aqua-pale); border: 1px solid var(--border); }
  .seg button { border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 7px 16px; border-radius: 9px; cursor: pointer; transition: background .3s var(--ease), color .3s, box-shadow .3s; }
  .seg button.on { background: var(--white); color: var(--navy); box-shadow: 0 2px 8px rgba(41, 38, 69, .1); }
  .month-view { position: relative; overflow: hidden; transition: height .6s var(--ease); touch-action: pan-y; }
  .month-panel { width: 100%; }
  .month-panel.leaving { position: absolute; top: 0; left: 0; }
  .month-panel.from-right { animation: slide-in-right .6s var(--ease) both; }
  .month-panel.from-left { animation: slide-in-left .6s var(--ease) both; }
  .month-panel.leaving.to-left { animation: slide-out-left .6s var(--ease) both; }
  .month-panel.leaving.to-right { animation: slide-out-right .6s var(--ease) both; }
  @keyframes slide-in-right { from { transform: translateX(100%); opacity: .3; } to { transform: none; opacity: 1; } }
  @keyframes slide-in-left { from { transform: translateX(-100%); opacity: .3; } to { transform: none; opacity: 1; } }
  @keyframes slide-out-left { to { transform: translateX(-100%); opacity: .3; } }
  @keyframes slide-out-right { to { transform: translateX(100%); opacity: .3; } }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .dow { text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding-bottom: 2px; }
  .day {
    min-height: 92px; border-radius: 11px; border: 1px solid var(--border); background: var(--white); padding: 6px;
    display: flex; flex-direction: column; gap: 3px; align-items: stretch; text-align: left; font: inherit; color: var(--navy); cursor: pointer; min-width: 0;
    transition: transform .2s var(--ease), border-color .3s, box-shadow .3s;
  }
  .day:hover { border-color: var(--blue); box-shadow: 0 6px 16px rgba(41, 38, 69, .08); }
  .day:active { transform: scale(.96); }
  .day.blank { visibility: hidden; }
  .day .d { font-weight: 700; font-size: .85rem; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
  .day.today .d { background: var(--blue); color: var(--white); }
  .day.past { opacity: .8; }
  .day .task { font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .task.done { text-decoration: line-through; opacity: .7; }
  .day .hrs { margin-top: auto; align-self: flex-start; font-size: .7rem; font-weight: 800; color: var(--white); background: var(--blue); border-radius: 6px; padding: 1px 6px; }
  .day.exam { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .day.exam .tag { margin-top: auto; font-size: .66rem; font-weight: 800; letter-spacing: .06em; color: var(--aqua); }
  .dot { display: none; }
  @media (max-width: 520px) {
    .cal-grid { gap: 4px; }
    .day { min-height: 58px; padding: 4px; border-radius: 9px; }
    .day .d { width: 22px; height: 22px; font-size: .78rem; }
    .day .task { display: none; }
    .dot { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); margin-left: 3px; }
    .day .hrs { font-size: .6rem; padding: 0 4px; }
    .day.exam .tag { font-size: .55rem; }
  }

  /* Day detail */
  .field { font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--white); color: var(--navy); min-width: 0; transition: border-color .2s, box-shadow .2s; }
  .field:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 103, 142, .15); }
  .field.grow { flex: 1; }
  .field.small { width: 74px; }

  /* Questions page: three equal boxes in a row */
  .hub { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 2vw, 16px); }
  .hub-box {

  .hub-box h3 { margin: 0 0 6px; font-size: clamp(.95rem, 3.2vw, 1.45rem); line-height: 1.15; }
  .hub-box span { font-size: clamp(.7rem, 2vw, .9rem); opacity: .85; }
  .hub-box.exam { background: var(--navy); color: var(--white); }
  .hub-box.quick { background: var(--blue); color: var(--white); }
  .hub-box.wrong { background: var(--white); color: var(--navy); border-color: var(--border); }

  /* Garden */
  .cc.g { background: var(--aqua); color: var(--navy); }
  .garden-card { padding-bottom: 22px; }
  .g-name { font-family: var(--serif); font-size: clamp(1.8rem, 6vw, 2.4rem); }
  .g-stage { position: relative; height: min(56vh, 520px); margin: 14px -8px 8px; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, #eef9f9, #d9f0f0); touch-action: none; }
  .g-stage.tall { height: min(60vh, 600px); margin-top: 0; }
  .g-stage canvas { display: block; width: 100%; height: 100%; }
  .g-zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  .g-zoom button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(41, 38, 69, .12); background: rgba(255, 255, 255, .88); color: var(--navy); font: inherit; font-size: 1.25rem; font-weight: 700; line-height: 1; cursor: pointer; box-shadow: 0 4px 12px rgba(41, 38, 69, .15); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .g-zoom button:active { transform: scale(.94); }
  .g-offline { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 20px; text-align: center; }
  .g-bar { position: relative; height: 10px; border-radius: 5px; background: var(--aqua-pale); margin: 22px 4px 30px; }
  .g-fill { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, #7cc35a, #3f8f4a); transition: width 1.2s var(--ease); }
  .g-mark { position: absolute; top: -4px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  /* Progression tracker: readings down the side, days to the exam across. Pastel marks so it is easy on the eyes. */
  .cc.p { background: #f6efe2; color: var(--navy); }
  .cc.p h2 { font-size: clamp(1.7rem, 5.6vw, 2.6rem); }
  :root { --pt-study: #b8d8f2; --pt-rev1: #faefc2; --pt-rev2: #f8e9b0; --pt-rev3: #f3db86; --pt-q90: #a7dcb2; --pt-q80: #c4e8cb; --pt-q70: #ddf1e0; --pt-q60: #f7e0cf; --pt-q50: #f3c9c1; --pt-q40: #eeb0ab; --pt-f1: #efe9f8; --pt-f2: #ddd1f1; --pt-f3: #c8b6e8; --pt-f4: #ae96db; --pt-sp: #b8d8f2; --pt-sp0: #dfedf9; --pt-sp1: #c7dff4; --pt-sp2: #aecfee; --pt-sp3: #93bde6; --pt-sp4: #77aadd; --pt-sp5: #5a95d2; --pt-due: #3f7fbf; --pt-old: #e3e7ea; --pt-plan: #5f656d; }
  .pt-scores.frm { grid-template-columns: repeat(4, 1fr); }
  .pt-exact { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: .9rem; color: var(--muted); }
  .pt-exact .field { width: 76px; padding: 7px 10px; }
  .pt-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .85rem; color: var(--muted); }
  .pt-legend i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: -3px; margin-right: 5px; border: 1px solid rgba(41, 38, 69, .08); }
  .pt-grad { display: inline-flex; gap: 2px; margin-right: 5px; vertical-align: -3px; }
  .pt-grad i { margin: 0; width: 12px; }
  .pt-wrap {
    width: calc(100vw - 32px); max-width: 1500px; margin: 0 0 0 calc(50% - min(50vw - 16px, 750px));
    overflow: auto; overscroll-behavior: none; /* no rubber-band pull past the table edges */ max-height: calc(100vh - 230px); max-height: calc(100dvh - 230px);
    background: var(--white); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 12px 30px rgba(41, 38, 69, .08);
  }
  .pt { border-collapse: separate; border-spacing: 0; font-size: .8rem; }
  .pt th, .pt td { border-bottom: 1px solid #edf3f4; border-right: 1px solid #f1f5f6; padding: 0; height: 30px; }
  .pt thead th { position: sticky; top: 0; z-index: 3; background: #f7fbfb; font-weight: 600; color: var(--muted); }
  .pt thead tr:nth-child(2) th { top: 30px; }
  .pt .c-topic, .pt .c-read { position: sticky; z-index: 2; background: var(--white); text-align: left; }
  .pt thead .c-topic, .pt thead .c-read { z-index: 4; background: #f7fbfb; }
  .pt .c-topic { left: 0; width: 112px; min-width: 112px; max-width: 112px; padding: 6px 8px; vertical-align: top; font-weight: 700; color: var(--navy); line-height: 1.2; border-right: 1px solid var(--border); }
  .pt .c-topic small { display: block; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .pt .c-read { left: 112px; width: 250px; min-width: 250px; max-width: 250px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--navy); border-right: 1px solid var(--border); box-shadow: 4px 0 8px -6px rgba(41, 38, 69, .25); }
  .pt .c-read b { display: inline-block; width: 22px; color: var(--muted); font-weight: 600; }
  .pt tr.grp td { border-top: 2px solid var(--border); }
  .pt tr.mock .c-topic, .pt tr.mock .c-read { background: #fbf8f1; }
  .pt tr.review .c-read { color: var(--muted); font-style: italic; padding-left: 30px; }
  .pt .d { width: 34px; min-width: 34px; text-align: center; font-size: .72rem; line-height: 1.05; }
  .pt .d.wk { color: #9aa3b8; }
  .pt thead th.d.today { background: var(--navy); color: var(--white); }
  .pt td.cell { width: 34px; min-width: 34px; cursor: pointer; position: relative; transition: background .25s; }
  .pt td.cell:hover { background: #f5fafa; }
  .pt td.cell.today { background: rgba(41, 38, 69, .045); }
  @media (max-width: 600px) {
    .pt tr.review .c-read { padding-left: 23px; }

    .pt .c-read { left: 68px; width: 128px; min-width: 128px; max-width: 128px; padding: 0 5px; font-size: .72rem; }
    .pt .c-read b { width: 18px; }
    .pt-wrap { width: calc(100vw - 16px); margin-left: calc(50% - 50vw + 8px); }
  }
  .pt td.cell .mk { position: absolute; inset: 3px; border-radius: 5px; display: flex; flex-direction: column; overflow: hidden; }
  .pt td.cell .mk span { flex: 1; }
  /* Spaced-revision reminder: a dashed blue ring with the gap (1d, 4d, 7d, 14d, 30d); solid and faint once done, stronger when overdue. */
  .pt td.cell .due { position: absolute; inset: 2px; border: 2px dashed var(--pt-due); border-radius: 6px; pointer-events: none; }
  .pt td.cell .due b { position: absolute; right: 1px; bottom: 0; font-size: .5rem; line-height: 1; font-weight: 800; color: var(--pt-due); background: rgba(255, 255, 255, .85); border-radius: 3px; padding: 1px 2px; }
  .pt td.cell .due.plan { border-style: dotted; border-color: var(--pt-plan); }
  .pt td.cell .due.plan b { color: var(--pt-plan); }
  .pt td.cell .due { z-index: 1; }
  .pt td.cell .due.done { border: 1.5px solid rgba(63, 127, 191, .55); }
  .pt td.cell .due.done b { background: #fff; color: #2f6aa6; }
  .pt td.cell .due.late { border-style: solid; box-shadow: 0 0 0 2px rgba(63, 127, 191, .2); }
  .pt td.cell .sc { position: absolute; inset: 0; display: grid; place-items: center; font-size: .62rem; font-weight: 700; color: rgba(41, 38, 69, .65); }
  /* The picker sheet */
  .pt-sheet-bg { position: fixed; inset: 0; background: rgba(41, 38, 69, .28); z-index: 50; opacity: 0; transition: opacity .3s; }
  .pt-sheet-bg.on { opacity: 1; }
  .pt-sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 51; width: min(520px, 100vw); transform: translate(-50%, 100%);
    background: var(--white); border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -12px 40px rgba(41, 38, 69, .2); transition: transform .4s var(--ease);
  }
  .pt-sheet.on { transform: translate(-50%, 0); }
  .pt-sheet h3 { margin: 0 0 2px; font-size: 1.05rem; }
  .pt-sheet .sub { margin: 0 0 14px; }
  .pt-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pt-opt { border: 2px solid transparent; border-radius: 14px; padding: 12px; font: inherit; font-weight: 700; color: var(--navy); cursor: pointer; text-align: left; }
  .pt-opt.on { border-color: var(--navy); }
  .pt-opt.on::after { content: " ✓"; }
  .pt-scores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
  .pt-scores.rev { grid-template-columns: repeat(3, 1fr); }
  .pt-opts.one { grid-template-columns: 1fr; }
  .pt-scores button { border: 2px solid transparent; border-radius: 10px; padding: 10px 0; font: inherit; font-weight: 700; font-size: .85rem; color: var(--navy); cursor: pointer; }
  .pt-scores button.on { border-color: var(--navy); }
  .pt-sheet .row-btns { display: flex; gap: 10px; margin-top: 16px; }
  .pt-sheet .row-btns .btn { flex: 1; }
  .g-mark i { width: 2px; height: 18px; background: var(--white); border-radius: 1px; box-shadow: 0 0 0 1px var(--border); }
  .g-mark b { font-size: .72rem; color: var(--muted); margin-top: 4px; font-weight: 700; }
  .g-mark:last-child i { background: transparent; box-shadow: none; }
  .g-next { margin: 0; }
  .g-btn { display: block; width: 100%; margin-top: 16px; padding: 18px; font-size: 1.1rem; border-radius: 16px; background: var(--navy); border-color: var(--navy); }
  .g-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 16px; }
  .g-tile { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--white); font: inherit; color: var(--navy); cursor: pointer; transition: border-color .3s, transform .2s var(--ease); }
  .g-tile:hover { border-color: var(--blue); }
  .g-tile:active { transform: scale(.97); }
  .g-tile.today { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
  .g-tile span { font-size: .8rem; color: var(--muted); }
  .g-tile .g-pct { color: var(--navy); font-weight: 700; }
  .g-mini { height: 5px; border-radius: 3px; background: var(--aqua-pale); overflow: hidden; margin-top: 4px; }
  .g-mini div { height: 100%; background: #5fae52; }

  .link-btn { background: none; border: 0; color: var(--blue); font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; padding: 4px 6px; }
  .link-btn:disabled { opacity: .3; cursor: default; }
  .card textarea.field { width: 100%; margin-bottom: 8px; resize: vertical; font-size: .95rem; }

  /* Screen transitions: the old screen fades out as a ghost while the new one eases in (a crossfade, no blank frame). */
  #app { position: relative; }
  .screen-ghost { position: absolute; pointer-events: none; z-index: 0; }
  .screen-ghost.out-fwd { animation: out-fwd .6s var(--ease) forwards; }
  .screen-ghost.out-back { animation: out-back .6s var(--ease) forwards; }
  .screen-ghost.out-up { animation: out-up .6s var(--ease) forwards; }
  #quiz { position: relative; }
  #quiz > .card { overflow: hidden; box-sizing: border-box; }
  .card-inner { will-change: transform, opacity; }
  #app.enter-fwd { animation: in-fwd .9s var(--ease) .12s both; }
  #app.enter-back { animation: in-back .9s var(--ease) .12s both; }
  #app.enter-up { animation: fade-up .9s var(--ease) .12s both; }
  .card-ghost { position: fixed; z-index: 3; pointer-events: none; margin: 0; animation: out-fwd .4s var(--ease) forwards; }
  .card.nt.card-in { animation: in-fwd .5s var(--ease) both; }
  @keyframes in-fwd { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes in-back { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes out-fwd { to { opacity: 0; transform: translateX(-24px); } }
  @keyframes out-back { to { opacity: 0; transform: translateX(24px); } }
  @keyframes out-up { to { opacity: 0; transform: translateY(-8px); } }

  /* Launch splash: plain navy. C, F, A pop in one at a time, then "Level 2", then it fades into the menu. */
  #splash {
    position: fixed; inset: 0; z-index: 100; background: var(--navy); color: var(--white);
    display: flex; align-items: center; justify-content: center; text-align: center;
    transition: opacity 1.2s var(--ease);
  }
  #splash.done { opacity: 0; pointer-events: none; }
  .s-cfa { font-weight: 700; font-size: clamp(6rem, 30vw, 12rem); line-height: 1; letter-spacing: .03em; }
  .s-cfa span, .s-level { display: inline-block; opacity: 0; animation: pop .75s cubic-bezier(.34, 1.45, .5, 1) forwards; }
  .s-cfa span:nth-child(1) { animation-delay: .35s; }
  .s-cfa span:nth-child(2) { animation-delay: .8s; }
  .s-cfa span:nth-child(3) { animation-delay: 1.25s; }
  .s-level { display: block; font-weight: 400; font-size: clamp(2.2rem, 9vw, 3.8rem); margin-top: 18px; animation-delay: 1.85s; }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(24px) scale(.5); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  main { transition: opacity 1.2s var(--ease), transform 1.2s var(--ease); }
  body.loading main { opacity: 0; transform: translateY(18px); }

  .nt .nt-gen ul { margin: 2px 0; padding-left: 18px; }
  .nt table.mini { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: .85rem; }
  .nt table.mini th, .nt table.mini td { text-align: left; padding: 4px 7px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .nt table.mini th { background: var(--aqua-pale); }
  .nt sub, .nt sup { font-size: 70%; line-height: 0; }
  .nt-big .opt { padding: 16px 16px; font-size: 1.04rem; line-height: 1.45; }
  .nt-det { margin-top: 12px; } .nt-det summary { cursor: pointer; color: var(--blue); font-weight: 650; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .15s !important; }
    body.loading main { transform: none; }
  }
  @media print {
    :root { --text: #000; --muted: #444; --border: #ccc; }
    body, html { background: #fff; }
    body::before, .row, .link, .progress, .ver, .glow-line, .nav, .btn { display: none !important; }
    .card { border: 0; padding: 0; box-shadow: none; }
    .note { break-inside: avoid; }
  }
</style>
</head>
<body class="loading">
<div id="splash" aria-hidden="true">
  <div>
    <div class="s-cfa"><span>C</span><span>F</span><span>A</span></div>
    <div class="s-level">Level 2</div>
  </div>
</div>
<main>
  <header class="brand" id="brand">
    <span class="brand-cfa">CFA</span><span class="brand-level">Level 2</span><span class="brand-sub">Practice Quiz</span>
  </header>
  <div class="glow-line"></div>
  <div id="app"></div>
  <p class="ver" id="ver"></p>
</main>
<script src="questions.js"></script>
<script src="vignettes.js"></script>
<script src="notes.js"></script>
<script src="garden.js"></script>
<script>
  const app = document.getElementById("app");
  const LETTERS = ["A", "B", "C", "D"];
  const STORE_KEY = "cfa-quiz-wrong";
  const PREFS_KEY = "cfa-quiz-prefs";
  const APP_VERSION = "v147 · 2026-10-27";
  const TOPICS = [
    "Quantitative Methods", "Economics", "Financial Statement Analysis", "Corporate Issuers", "Equity Valuation",
    "Fixed Income", "Derivatives", "Alternative Investments", "Portfolio Management", "Ethical and Professional Standards"
  ];
  const EXAM_QUESTIONS = VIGNETTES.flatMap(v => v.questions);
  const ALL_QUESTIONS = QUESTIONS.concat(EXAM_QUESTIONS);
  // Quick mode counts questions; exam mode counts vignettes (each is a whole item set).
  const MODES = {
    quick: { name: "Quick questions", unit: "question", counts: [5, 10, 15, 20], items: t => QUESTIONS.filter(q => q.topic === t) },
    exam: { name: "Exam style", unit: "vignette", counts: [1, 2, 3], items: t => VIGNETTES.filter(v => v.topic === t) }
  };

  let backTo = () => home("back"); // where "Start over" and quitting return to
  let flow = "single";             // "single": one question per screen; "vignette": one item set per screen
  let deck = [], i = 0, score = 0, missed = [], reviewMode = false;
  let inQuiz = false, paused = false, answeredCurrent = false;
  let vdeck = [], vi = 0, checkedCurrent = false, vscores = [];

  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const qCount = vs => vs.reduce((n, v) => n + v.questions.length, 0);

  // Timer: counts only while a quiz is running and not paused.
  let elapsed = 0, runningSince = null;
  function timerReset() { elapsed = 0; runningSince = Date.now(); }
  function timerPause() { if (runningSince) { elapsed += Date.now() - runningSince; runningSince = null; } }
  function timerResume() { if (!runningSince) runningSince = Date.now(); }
  function timeMs() { return elapsed + (runningSince ? Date.now() - runningSince : 0); }
  function fmt(ms) {
    const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    const pad = n => String(n).padStart(2, "0");
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  }
  setInterval(() => {
    const t = document.getElementById("timer");
    if (t) t.textContent = flow === "single" ? `Total ${fmt(timeMs())}` : `⏱ ${fmt(timeMs())}`;
    const qt = document.getElementById("qtimer");
    if (qt) qt.textContent = fmt(qTimeMs());
  }, 250);

  function loadPrefs() {
    try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; }
  }
  function savePrefs(p) {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify({ ...loadPrefs(), ...p })); } catch {}
  }

  // Wrong-answers notebook, saved on this device: { [question text]: { count, last } }
  function loadWrong() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  }
  function saveWrong(w) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(w)); } catch {}
  }
  function today() { return new Date().toLocaleDateString("en-CA"); }
  function wrongList() {
    const w = loadWrong();
    return ALL_QUESTIONS.filter(q => w[q.q]).sort((a, b) => w[b.q].count - w[a.q].count);
  }
  function record(q, correct) {
    const w = loadWrong();
    if (!correct) w[q.q] = { count: ((w[q.q] && w[q.q].count) || 0) + 1, last: today() };
    else if (reviewMode) delete w[q.q]; // got it right while reviewing → it leaves the notebook
    saveWrong(w);
  }
  function qLabel(q) { return q.vignette ? `${q.vignette.title} · Q${q.num}` : `${q.topic} · ${q.reading}`; }

  function shuffle(a) {
    a = a.slice();
    for (let k = a.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [a[k], a[j]] = [a[j], a[k]];
    }
    return a;
  }

  function el(tag, attrs = {}, text) {
    const e = document.createElement(tag);
    Object.assign(e, attrs);
    if (text !== undefined) {
      if (typeof text === "string" && text.includes("[[")) e.append(richText(text));
      else e.textContent = text;
    }
    return e;
  }
  // Formulas: [[numerator|denominator]] is drawn as a stacked fraction (numerator above a line, denominator below).
  function richText(text) {
    const frag = document.createDocumentFragment(), re = /\[\[([^|\]]*)\|([^\]]*)\]\]/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) frag.append(text.slice(last, m.index));
      const f = document.createElement("span");
      f.className = "frac";
      const n = document.createElement("span"), d = document.createElement("span");
      n.textContent = m[1]; d.textContent = m[2];
      f.append(n, d);
      frag.append(f);
      last = re.lastIndex;
    }
    if (last < text.length) frag.append(text.slice(last));
    return frag;
  }
  // The same text on one line, for files and print: (numerator)/(denominator).
  const plainText = t => String(t).replace(/\[\[([^|\]]*)\|([^\]]*)\]\]/g, (_, n, d) => `${/^[\w.]+$/.test(n) ? n : `(${n})`}/${/^[\w.]+$/.test(d) ? d : `(${d})`}`);

  // Clear the screen and animate the new one in: "fwd" slides from the right, "back" from the left, "up" fades up.
  function screen(dir = "fwd") {
    // Keep a copy of the old screen where it was on screen and fade it out while the new one eases in.
    document.querySelectorAll(".screen-ghost").forEach(g => g.remove());
    if (app.children.length) {
      const ghost = el("div", { className: `screen-ghost out-${dir}` });
      ghost.append(...app.childNodes);
      ghost.querySelectorAll("[id]").forEach(n => n.removeAttribute("id")); // ids (timer, quiz) belong to the new screen
      ghost.style.top = `${app.offsetTop - window.scrollY}px`;
      ghost.style.left = `${app.offsetLeft}px`;
      ghost.style.width = `${app.offsetWidth}px`;
      app.parentNode.insertBefore(ghost, app);
      setTimeout(() => ghost.remove(), 650);
    }
    app.innerHTML = "";
    app.classList.remove("enter-fwd", "enter-back", "enter-up");
    void app.offsetWidth; // restart the animation
    app.classList.add(`enter-${dir}`);
    window.scrollTo(0, 0);
  }

  // Tap a stepper button for one step; hold it for 1.5s and it keeps stepping on its own (slowly, then a bit faster).
  function holdRepeat(btn, step) {
    let hold = null, rep = null, repeated = false;
    const stop = () => { clearTimeout(hold); clearInterval(rep); hold = rep = null; btn.classList.remove("holding"); };
    btn.addEventListener("pointerdown", () => {
      stop();
      repeated = false;
      hold = setTimeout(() => {
        repeated = true;
        btn.classList.add("holding");
        let n = 0;
        const tick = () => {
          if (!step()) return stop();
          if (++n === 10) { clearInterval(rep); rep = setInterval(tick, 160); }
        };
        tick();
        rep = setInterval(tick, 320);
      }, 1500);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener("contextmenu", e => e.preventDefault());
    btn.addEventListener("click", () => { if (repeated) repeated = false; else step(); });
  }

  function nav(backLabel, onBack) {
    const bar = el("div", { className: "nav" });
    const b = el("button", { className: "back" }, `‹ ${backLabel}`);
    b.onclick = onBack;
    bar.append(b);
    return bar;
  }

  // ---------- Vignette text and exhibits ----------
  const isNum = t => /^[–−+-]?[$£]?[\d,.]+%?\*?$/.test(t.trim());
  function renderBody(v) {
    const box = el("div", { className: "vignette" });
    v.body.forEach(([type, data]) => {
      if (type === "h") box.append(el("h3", {}, data));
      else if (type === "p") box.append(el("p", {}, data));
      else if (type === "table") {
        const ex = el("div", { className: "exhibit" });
        ex.append(el("p", { className: "ex-title" }, data.title));
        const table = el("table");
        if (data.head.some(h => h)) {
          const tr = el("tr");
          // Right-align a header when its column holds numbers.
          const numCol = c => c > 0 && data.rows.some(r => r.length > 1 && r[c] && isNum(r[c]));
          data.head.forEach((h, c) => tr.append(el("th", { className: numCol(c) ? "num-cell" : "" }, h)));
          const thead = el("thead");
          thead.append(tr);
          table.append(thead);
        }
        const tbody = el("tbody");
        data.rows.forEach(r => {
          const tr = el("tr");
          if (r.slice(1).every(c => /^\d{4}\*?$/.test(c))) tr.className = "subhead";
          if (r.length === 1) tr.append(el("td", { colSpan: data.head.length }, r[0])); // section row across the table
          else r.forEach(c => tr.append(el("td", { className: isNum(c) ? "num-cell" : "" }, c)));
          tbody.append(tr);
        });
        table.append(tbody);
        const scroll = el("div", { className: "scroll" });
        scroll.append(table);
        ex.append(scroll);
        if (data.note) ex.append(el("p", { className: "ex-note" }, data.note));
        box.append(ex);
      }
    });
    return box;
  }
  function vignetteDetails(v, open = false) {
    const d = el("details", { open });
    d.append(el("summary", {}, `Vignette: ${v.title}`), renderBody(v));
    return d;
  }
  function vignetteText(v) {
    let out = `=== Vignette: ${v.title} (${v.topic} · ${v.reading}) ===\n`;
    v.body.forEach(([type, data]) => {
      if (type === "h") out += `\n${data}\n`;
      else if (type === "p") out += `${data}\n`;
      else {
        out += `\n${data.title}\n`;
        if (data.head.some(h => h)) out += `  ${data.head.join(" | ")}\n`;
        data.rows.forEach(r => (out += `  ${r.join(" | ")}\n`));
        if (data.note) out += `  ${data.note}\n`;
        out += "\n";
      }
    });
    return out;
  }


  // ---------- Wrong-answer notes ----------
  // Condensed notes on questions missed in practice papers (data in notes.js). A note counts as absorbed after two
  // correct answers in a row, and then fades; a wrong answer starts the count again.
  const NOTES_KEY = "cfa-notes";
  // Two modes keep separate progress: "full" (solve it) and "dir" (bed mode: only pick the right direction).
  const noteMode = () => (loadPrefs().notesMode === "dir" ? "dir" : "full");
  const notesKey = () => (noteMode() === "dir" ? NOTES_KEY + "-dir" : NOTES_KEY);
  const loadNotes = () => { try { return JSON.parse(localStorage.getItem(notesKey())) || {}; } catch { return {}; } };
  const saveNotes = d => { try { localStorage.setItem(notesKey(), JSON.stringify(d)); } catch {} };
  const noteSt = (d, n) => d[n.id] || { streak: 0, tries: 0 };
  const noteDone = (d, n) => noteSt(d, n).streak >= 2;
  function notesSummary() {
    const d = loadNotes(), a = NOTES.filter(n => noteDone(d, n)).length;
    return `${plural(NOTES.length, "note")} · ${a} absorbed`;
  }
  const dateLabel = iso => fromKey(iso).toLocaleDateString([], { day: "numeric", month: "short" });
  const noteTag = n => n.tag;
  function noteBar(items, d) {
    const a = items.filter(n => noteDone(d, n)).length;
    const bar = el("div", { className: "nt-bar" });
    const f = el("div"); f.style.width = `${items.length ? Math.round(a / items.length * 100) : 0}%`;
    bar.append(f);
    return [a, bar];
  }

  function notesHub(dir = "fwd") {
    screen(dir);
    backTo = () => notesHub("back");
    app.append(nav("Menu", () => home("back")));
    const d = loadNotes(), tab = loadPrefs().notesTab || "session";
    app.append(el("h1", { className: "title" }, "Wrong-answer notes"),
      el("p", { className: "sub" }, noteMode() === "dir" ? "Bed mode: one short concept check per note, no calculating. Two in a row and it fades." : "Two correct answers in a row and a note fades: it is absorbed."));
    const modes = el("div", { className: "nt-tabs" });
    [["full", "Solve it"], ["dir", "Quick check (bed mode)"]].forEach(([k, label]) => {
      const b = el("button", { className: noteMode() === k ? "on" : "" }, label);
      b.onclick = () => { savePrefs({ notesMode: k }); notesHub("back"); };
      modes.append(b);
    });
    app.append(modes);
    const tabs = el("div", { className: "nt-tabs" });
    [["session", "By session"], ["topic", "By topic"]].forEach(([k, label]) => {
      const b = el("button", { className: tab === k ? "on" : "" }, label);
      b.onclick = () => { savePrefs({ notesTab: k }); notesHub("back"); };
      tabs.append(b);
    });
    app.append(tabs);
    const addItem = (title, sub, items, spec) => {
      const [a, bar] = noteBar(items, d);
      const b = el("button", { className: "nt-item" + (a === items.length ? " absorbed" : "") });
      b.append(el("b", {}, title), el("span", {}, `${sub} · ${a} of ${items.length} absorbed`), bar);
      b.onclick = () => noteList(spec);
      app.append(b);
    };
    if (tab === "session") {
      NOTE_SESSIONS.slice().sort((x, y) => y.date.localeCompare(x.date) || y.id.localeCompare(x.id)).forEach(s => {
        const items = NOTES.filter(n => n.set === s.id);
        addItem(`${dateLabel(s.date)} · ${s.name}`, `${s.label} · ${plural(items.length, "note")}`, items, { title: `${dateLabel(s.date)} · ${s.name}`, sub: s.label, items });
      });
    } else {
      [...new Set(NOTES.map(n => n.reading))].sort((x, y) => x - y).forEach(r => {
        const items = NOTES.filter(n => n.reading === r);
        addItem(`${r} · ${NOTE_READINGS[r]}`, `${items[0].subject} · ${plural(items.length, "note")}`, items, { title: `${r} · ${NOTE_READINGS[r]}`, sub: items[0].subject, items });
      });
    }
  }

  function noteList(spec, dir = "fwd") {
    screen(dir);
    backTo = () => noteList(spec, "back");
    app.append(nav("Notes", () => notesHub("back")));
    const d = loadNotes(), items = spec.items;
    const open = items.filter(n => !noteDone(d, n));
    app.append(el("h1", { className: "title" }, spec.title), el("p", { className: "sub" }, `${spec.sub} · ${items.length - open.length} of ${items.length} absorbed`));
    const prefs = loadPrefs();
    const tools = el("div", { className: "nt-tools" });
    const all = el("button", { className: "btn" }, `Practise all (${items.length})`);
    all.onclick = () => noteQuiz(noteDeck(items), 0, spec, { right: 0, got: [], fresh: [] });
    const rest = el("button", { className: "btn ghost" }, `Not yet absorbed (${open.length})`);
    rest.disabled = !open.length;
    rest.onclick = () => noteQuiz(noteDeck(open), 0, spec, { right: 0, got: [], fresh: [] });
    tools.append(all, rest);
    app.append(tools);
    const shuf = el("label", { className: "sub" });
    const cb = el("input", { type: "checkbox", checked: prefs.notesShuffle !== false });
    cb.onchange = () => savePrefs({ notesShuffle: cb.checked });
    shuf.append(cb, " Shuffle order of notes and answers");
    app.append(shuf);
    items.forEach(n => {
      const st = noteSt(d, n);
      const row = el("button", { className: "nt-row" + (noteDone(d, n) ? " absorbed" : "") });
      const mid = el("div", { className: "mid" });
      mid.append(el("b", {}, n.title), el("span", {}, `${n.subject} · ${n.reading} ${NOTE_READINGS[n.reading]}${n.guess ? " · guessed right" : n.solved ? " · right, explained" : ""}`));
      const dots = el("div", { className: "nt-dots" });
      [0, 1].forEach(k => dots.append(el("i", { className: st.streak > k ? "on" : "" })));
      row.append(el("span", { className: "tag" }, noteTag(n)), mid, dots);
      row.onclick = () => noteQuiz([n], 0, spec, { right: 0, got: [], fresh: [] });
      app.append(row);
    });
    const reset = el("button", { className: "link-btn" }, "Reset progress for this list");
    reset.onclick = () => {
      if (!confirm("Reset the absorbed progress for this list?")) return;
      const dd = loadNotes(); items.forEach(n => delete dd[n.id]); saveNotes(dd); noteList(spec, "back");
    };
    app.append(el("div", { className: "row" }, ""), reset);
  }
  function noteDeck(items) { return loadPrefs().notesShuffle !== false ? shuffle(items) : items.slice(); }

  const noBold = h => h.replace(/<\/?(b|strong)>/g, ""); // bold in a question is a hint, so questions are shown plain
  function noteQuiz(deck, k, spec, run) {
    // Moving to the next question only animates the white card: the header and back link stay where they are.
    const oldCard = k > 0 ? app.querySelector(".card.nt") : null;
    let ghost = null;
    if (oldCard) {
      const rect = oldCard.getBoundingClientRect();
      ghost = oldCard.cloneNode(true);
      ghost.classList.add("card-ghost");
      ghost.style.cssText = `top:${rect.top}px;left:${rect.left}px;width:${rect.width}px;`;
      oldCard.remove();
      backTo = () => noteList(spec, "back");
    } else {
      screen("fwd");
      backTo = () => noteList(spec, "back");
      app.append(nav(spec.title, () => noteList(spec, "back")));
    }
    const n = deck[k], dirMode = noteMode() === "dir" && !!NOTE_QUICK[n.id];
    const card = el("div", { className: "card nt" + (dirMode ? " nt-big" : "") });
    const meta = el("div", { className: "meta" });
    meta.append(el("span", {}, `${noteTag(n)} · ${n.reading} ${NOTE_READINGS[n.reading]}`), el("span", {}, `${k + 1} of ${deck.length}`));
    card.append(meta);
    if (!dirMode) card.append(el("h3", { className: "title" }, n.title)); // bed mode: the title would give the answer away
    if (dirMode) card.append(el("p", { className: "q" }, NOTE_QUICK[n.id][0]));
    else {
      const ul = el("ul", { className: "nt-stem" });
      n.stem.forEach(t => { const li = el("li"); li.innerHTML = noBold(t); ul.append(li); });
      const ask = el("p", { className: "q" }); ask.innerHTML = noBold(n.ask);
      card.append(ul, ask);
    }
    const opts = dirMode ? NOTE_QUICK[n.id].slice(1).map(t => ({ t, n: "" })) : n.options, ansIdx = dirMode ? 0 : n.answer;
    const order = loadPrefs().notesShuffle !== false ? shuffle(opts.map((_, i) => i)) : opts.map((_, i) => i);
    const holder = el("div"), after = el("div");
    const btns = order.map((oi, pos) => {
      const b = el("button", { className: "opt" });
      b.innerHTML = `${LETTERS[pos]}. ${noBold(opts[oi].t)}`;
      b.onclick = () => reveal(oi);
      holder.append(b);
      return b;
    });
    card.append(holder, after);
    app.append(card);
    if (ghost) {
      card.classList.add("card-in");
      document.body.append(ghost);
      setTimeout(() => ghost.remove(), 500);
      window.scrollTo(0, 0);
    }

    function reveal(pick) {
      const ok = pick === ansIdx;
      btns.forEach((b, pos) => {
        const oi = order[pos];
        b.disabled = true;
        if (oi === ansIdx) b.classList.add("correct"); else if (oi === pick) b.classList.add("wrong");
        if (opts[oi].n) {
          const why = el("div", { className: "nt-why-opt" + (oi === ansIdx ? " good" : "") });
          why.innerHTML = opts[oi].n;
          b.after(why);
        }
      });
      const d = loadNotes(), st = { ...noteSt(d, n) }, was = st.streak >= 2;
      st.tries += 1; st.streak = ok ? st.streak + 1 : 0; st.last = today();
      d[n.id] = st; saveNotes(d);
      if (ok) run.right += 1;
      run.got.push(n.id);
      const fresh = ok && !was && st.streak >= 2;
      if (fresh) run.fresh.push(n.title);
      const badge = el("div");
      badge.append(el("span", { className: `nt-badge ${ok ? "good" : "bad"}` }, ok ? "✓ Correct" : "✗ Not quite"));
      if (fresh) badge.append(el("span", { className: "nt-badge soft" }, "Absorbed: it will show lighter now"));
      else if (ok) badge.append(el("span", { className: "nt-badge soft" }, `${st.streak} of 2 in a row`));
      if (!ok && !n.guess && !n.solved && !n.drill && !dirMode) badge.append(el("span", { className: "sub" }, ` In the mock you chose: ${n.options[n.mine].t.replace(/<[^>]+>/g, "")}`));
      if (n.guess && !dirMode) badge.append(el("span", { className: "sub" }, " You guessed this one right in the set: make sure it is really yours."));
      after.append(badge);
      if (dirMode) after.append(el("h3", { className: "title" }, n.title));
      const sec = (title, html) => { after.append(el("h4", {}, title)); const box = el("div"); box.innerHTML = html; after.append(box); return box; };
      sec(dirMode ? "Rule" : "Formula", `<div class="nt-formula">${n.formula.map(f => `<div>${f}</div>`).join("")}</div>`);
      // Bed mode shows the full working too, so the calculation can be recalled without solving it.
      sec(dirMode ? "How to calculate it" : "Why", `<ol>${n.why.map(w => `<li>${w}</li>`).join("")}</ol>`);

  function ptDue(p) {

      b.style.background = `var(${PT_SP[v]})`;
      b.onclick = () => { const m = has("v"); if (m && vStage(m) === v) marks = marks.filter(x => x.t !== "v"); else if (m) m.d = v; else marks.push({ t: "v", d: v }); draw(); };
      revSteps.append(b);
      return [v, b];
    });
    const bP = el("button", { className: "pt-opt" }, "Plan");
    bP.style.cssText = "background:var(--pt-plan);color:#fff";

    const revs = el("div", { className: "pt-scores rev" });
    const rb = PT_REV.map(([v, t, c]) => {

      b.onclick = () => { const r = has("r"); if (r && (r.d || 2) === v) marks = marks.filter(m => m.t !== "r"); else if (r) r.d = v; else marks.push({ t: "r", d: v }); draw(); };
      revs.append(b);

    const frms = el("div", { className: "pt-scores frm" });
    const fb = PT_FRM.map(([v, t, c]) => {
      const b = el("button", {}, t);
      b.style.background = `var(${c})`;
      b.onclick = () => { const f = has("f"); if (f && f.d === v) marks = marks.filter(m => m.t !== "f"); else if (f) f.d = v; else marks.push({ t: "f", d: v }); draw(); };
      frms.append(b);

    // Exact score for days logged from question sets (e.g. 34 of 50): editable, in case a set was marked wrongly.

    exact.append("Correct", fr, "out of", fn);
    const upd = () => { const q = has("q"), a = parseInt(fr.value, 10), n = parseInt(fn.value, 10); if (!q || !(n > 0) || !(a >= 0)) return; q.right = Math.min(a, n); q.n = n; q.s = Math.round(q.right / n * 100); sb.forEach(([v, b]) => b.classList.toggle("on", false)); };
    fr.oninput = fn.oninput = upd;
    const sb = PT_SCORES.map(([v, t, c]) => {
      const b = el("button", {}, t);
      b.style.background = `var(${c})`;
      b.onclick = () => { const q = has("q"); if (q && q.s === v) marks = marks.filter(m => m.t !== "q"); else if (q) { q.s = v; delete q.n; } else marks.push({ t: "q", s: v }); draw(); };
      scores.append(b);
      return [v, b];
    });
    function draw() {
      const v = has("v");
      vb.forEach(([n, b]) => b.classList.toggle("on", !!v && vStage(v) === n));
      bP.classList.toggle("on", !!has("p"));
      const r = has("r");
      rb.forEach(([v, b]) => b.classList.toggle("on", !!r && (r.d || 2) === v));
      const q = has("q");
      sb.forEach(([v, b]) => b.classList.toggle("on", !!q && q.s === v));
      const f = has("f");
      fb.forEach(([v, b]) => b.classList.toggle("on", !!f && f.d === v));

  // Create custom: choose how many questions (quick) or vignettes (exam) from each of the 10 topics.
  // Daily questions: quick questions shown in yesterday's daily sets (and in today's earlier ones) are left out.
  // Stored on this device: { "YYYY-MM-DD": [question text, …] }
  const DAILY_KEY = "cfa-daily";
  function loadDaily() { try { return JSON.parse(localStorage.getItem(DAILY_KEY)) || {}; } catch { return {}; } }
  function logDaily(qs) {
    const d = loadDaily(), k = today(), y = new Date(); y.setDate(y.getDate() - 1);
    d[k] = [...new Set([...(d[k] || []), ...qs.map(q => q.q)])];
    Object.keys(d).forEach(x => { if (x < dkey(y)) delete d[x]; }); // only yesterday and today are needed
    try { localStorage.setItem(DAILY_KEY, JSON.stringify(d)); } catch {}
  }

  function customSetup(mode, dir = "fwd", daily = false) {
    screen(dir);
    backTo = () => customSetup(mode, "back", daily);
    const prefKey = daily ? "daily" : mode;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const dl = loadDaily(), seenY = dl[dkey(y)] || [], seenT = dl[today()] || [];
    const skip = new Set(daily ? [...seenY, ...seenT] : []);
    const m = { ...MODES[mode], items: t => MODES[mode].items(t).filter(q => !skip.has(q.q)) };
    const prefs = loadPrefs(), saved = (prefs.custom || {})[prefKey] || {};
    const counts = {};
    TOPICS.forEach(t => (counts[t] = Math.min(saved[t] || 0, m.items(t).length)));

    app.append(nav(m.name, () => topics(mode, "back")));
    if (daily) {
      const parts = [];
      if (seenY.length) parts.push(`${plural(seenY.length, "question")} from yesterday's daily questions`);
      if (seenT.length) parts.push(`${seenT.length} already done today`);
      app.append(el("h1", { className: "title" }, "Daily questions"),
        el("p", { className: "sub" }, parts.length ? `Build today's set. Left out: ${parts.join(" and ")}.` : "Build today's set. No daily questions yesterday, so every question is available."));
    } else app.append(el("h1", { className: "title" }, "Create custom"),
      el("p", { className: "sub" }, `Choose how many ${m.unit}s to take from each topic. Use one topic or mix all ten.`));

    const footer = el("div", { className: "card sticky" });
    const total = el("p", { className: "total" });
    const detail = el("p", { className: "cnt", style: "margin:2px 0 0" });
    const row = el("div", { className: "row", style: "margin-top:12px" });
    const shuf = el("label", { className: "check" });
    const cb = el("input", { type: "checkbox", checked: (prefs.customMix || {})[mode] ?? true });
    shuf.append(cb, mode === "quick" ? "Mix topics together" : "Shuffle vignette order");
    const go = el("button", { className: "btn" }, "Start");
    row.append(go, shuf);
    footer.append(total, detail, row);

    function update() {
      const n = TOPICS.reduce((s, t) => s + counts[t], 0);
      const used = TOPICS.filter(t => counts[t] > 0).length;
      total.textContent = n ? `${plural(n, m.unit)} from ${plural(used, "topic")}` : "Nothing selected yet";
      detail.textContent = !n ? "Use + to add from any topic."
        : mode === "exam" ? "Each vignette comes with all of its questions." : "Questions are picked at random from each topic.";
      go.disabled = n === 0;
    }

    const list = el("div", { className: "card list" });
    TOPICS.forEach((t, idx) => {
      const avail = m.items(t).length;
      const row = el("div", { className: "topic-row custom-row" + (avail ? "" : " off") });
      const text = el("div");
      const hidden = MODES[mode].items(t).length - avail;
      text.append(el("div", { className: "name" }, t), el("div", { className: "cnt" }, avail ? `${plural(avail, m.unit)} available${hidden ? ` · ${hidden} left out` : ""}` : hidden ? "All of them came up recently" : "No questions yet"));
      const stepper = el("div", { className: "stepper" });
      const minus = el("button", { className: "step", ariaLabel: `Fewer from ${t}` }, "−");
      const val = el("span", { className: "val" });
      const plus = el("button", { className: "step", ariaLabel: `More from ${t}` }, "+");
      const all = el("button", { className: "step all" }, "All");
      const draw = () => {
        val.textContent = counts[t];
        val.classList.toggle("on", counts[t] > 0);
        minus.disabled = counts[t] === 0;
        plus.disabled = all.disabled = counts[t] >= avail;
        update();
      };
      holdRepeat(minus, () => { if (counts[t] <= 0) return false; counts[t]--; draw(); return counts[t] > 0; });
      holdRepeat(plus, () => { if (counts[t] >= avail) return false; counts[t]++; draw(); return counts[t] < avail; });
      all.onclick = () => { counts[t] = avail; draw(); };
      stepper.append(minus, val, plus, all);
      row.append(el("span", { className: "num" }, String(idx + 1)), text, stepper);
      list.append(row);
      draw();
    });

    go.onclick = () => {
      savePrefs({ custom: { ...(prefs.custom || {}), [prefKey]: counts }, customMix: { ...(prefs.customMix || {}), [mode]: cb.checked } });
      // A random selection of the requested number from each topic, kept in topic order unless mixed.
      let picked = TOPICS.flatMap(t => shuffle(m.items(t)).slice(0, counts[t]));
      if (cb.checked) picked = shuffle(picked);
      if (daily) logDaily(picked);
      mode === "quick" ? begin(picked, false, true) : beginExam(picked);
    };
    app.append(list, footer);
  }

  // ---------- Study timer and calendar ----------
  // Stored on this device: { days: { "YYYY-MM-DD": { tasks: [{ text, done }], sessions: [{ start, end, sec, manual }] } }, timer: { since } }
  const STUDY_KEY = "cfa-study";
  const EXAM = new Date(2026, 10, 20, 14, 30);          // CFA Level 2 exam: Fri 20 Nov 2026, 14:30
  const CAL_MONTHS = [[2026, 8], [2026, 9], [2026, 10]]; // September–November 2026 (months are 0-based)
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const MIN_SESSION_SEC = 5; // ignore accidental start/pause taps

  function loadStudy() {
    let s = { days: {}, timer: {} };
    try { const t = JSON.parse(localStorage.getItem(STUDY_KEY)); if (t && t.days) s = { timer: {}, ...t }; } catch {}
    return seedPlan(s);

  // The first final-weeks plan (two full question-bank rounds), kept only so its tasks can be taken off the calendar.
  const QB = [["Equity 1/3 · 49 Qs", "Port 1/2 · 69 Qs", 118], ["FSA 1/3 · 47 Qs", "FI 1/2 · 68 Qs", 115], ["Econ 1/2 · 50 Qs", "Deriv 1/2 · 49 Qs", 99],
    ["Equity 2/3 · 49 Qs", "Quant 1/2 · 67 Qs", 116], ["FSA 2/3 · 47 Qs", "Port 2/2 · 69 Qs", 116], ["Alt 1/2 · 50 Qs", "Econ 2/2 · 50 Qs", 100],
    ["Equity 3/3 · 49 Qs", "FI 2/2 · 67 Qs", 116], ["FSA 3/3 · 47 Qs", "Quant 2/2 · 67 Qs", 114], ["Alt 2/2 · 49 Qs", "Deriv 2/2 · 49 Qs", 98]];
  function oldPlan() {
    const plan = { 28: ["Mock 1"], 9: ["Mock 2"], 8: ["Review Mock 2 mistakes"], 7: ["Mock 3"], 6: ["Review Mock 3 mistakes"],
      5: ["Weak areas & formulas", "Ethics revision"], 4: ["Weak areas & formulas", "Ethics revision"], 3: ["Mock 4 (exam conditions)"],
      2: ["Review Mock 4 mistakes", "Formula sheet & Ethics skim"], 1: ["Rest · light skim only"] };
    QB.forEach(([a, b, n], i) => [27 - i, 18 - i].forEach((d, r) => {
      const m = n * 3;
      plan[d] = [a, b, `Q bank round ${r + 1} · ${n} Qs · ~${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m + review`];
    }));
    const out = {};
    Object.entries(plan).forEach(([n, texts]) => { const d = midnight(EXAM); d.setDate(d.getDate() - Number(n)); out[dkey(d)] = texts; });
    return out;
  }
  // The final-weeks plan: one pass of the question bank (1,091 Qs, 22 Oct – 3 Nov; FSA+FI and Port+Equity in thirds,
  // the smaller topics a whole topic a day), then redoing wrong/unsure questions, then mocks. Each question day starts
  // by skimming that day's notes and ends with spaced review of wrong questions (today's, and from 1, 4 and 7 days ago).
  function newPlan() {
    const qs = n => { const m = n * 3; return `${n} Qs · ~${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m + review`; };
    const spaced = "Wrong Qs: today's (10 min) + 1/4/7 days ago (20 min)";
    const day = (topics, notes, n, first) => [...topics, `Skim notes first (15–20 min): ${notes}`, first ? "Wrong Qs: recall today's at day end (10 min)" : spaced, qs(n)];
    const pair1 = i => [`FSA ${i}/3 · 47 Qs`, `FI ${i}/3 · 45 Qs`], pair2 = i => [`Port ${i}/3 · 46 Qs`, `Equity ${i}/3 · 49 Qs`];
    const one = (t, n) => day([`${t} · all ${n} Qs`], t, n);

    const days = Math.round((midnight(EXAM) - midnight(date)) / 86400000);
    return days > 0 ? `D-${days}` : days === 0 ? "D-Day" : `D+${-days}`;
  }

  // Record a study span, splitting it at midnight so each day gets its own hours.
  function addSpan(s, start, end, manual = false) {
    while (start < end) {
      const next = midnight(new Date(start)); next.setDate(next.getDate() + 1);
      const stop = Math.min(end, next.getTime());
      dayOf(s, dkey(new Date(start))).sessions.push({ start, end: stop, sec: Math.round((stop - start) / 1000), manual });
      start = stop;
    }
  }

  // The timer stores only its start time, so it keeps counting while the screen is locked or the app is closed.
  // Today's focused time = saved sessions today + the running part since midnight. Pause freezes it; Concentrate continues it.
  function todayFocusSec(s = loadStudy()) {
    const since = s.timer.since ? Math.max(s.timer.since, midnight(new Date()).getTime()) : null;
    return daySec(s, dkey(new Date())) + (since ? Math.floor((Date.now() - since) / 1000) : 0);
  }
  function runningSec() { const s = loadStudy(); return s.timer.since ? Math.floor((Date.now() - s.timer.since) / 1000) : 0; }
  function toggleStudy() {
    const s = loadStudy();
    if (s.timer.since) {
      const sec = Math.floor((Date.now() - s.timer.since) / 1000);
      if (sec >= MIN_SESSION_SEC) addSpan(s, s.timer.since, Date.now());
      s.timer.since = null;
      saveStudy(s);
      toast(sec >= MIN_SESSION_SEC ? `Saved ${fmtDur(sec) === "0m" ? `${sec}s` : fmtDur(sec)} to today's calendar` : "Too short to save");
      lockScreen(false);
    } else {
      s.timer.since = Date.now();
      saveStudy(s);
      lockScreen(true);
    }
  }

  // Lock screen: iOS web apps can't use Live Activities, so the timer registers as "Now Playing" media.
  // A silent audio loop keeps the media session alive; the lock screen then shows the elapsed time and a play/pause button.
  let silentAudio = null;
  function silentWavUrl() {
    const rate = 8000, n = rate; // 1 second of silence, 8 kHz mono 16-bit
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const str = (o, t) => [...t].forEach((c, k) => v.setUint8(o + k, c.charCodeAt(0)));
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }
  function lockScreen(running) {
    if (!("mediaSession" in navigator)) return;
    try {
      if (!silentAudio) {
        silentAudio = new Audio(silentWavUrl());
        silentAudio.loop = true;
        silentAudio.setAttribute("playsinline", "");
        navigator.mediaSession.setActionHandler("play", () => { if (!loadStudy().timer.since) { toggleStudy(); refreshFocus(); } });
        navigator.mediaSession.setActionHandler("pause", () => { if (loadStudy().timer.since) { toggleStudy(); refreshFocus(); } });
      }
      const today = todayFocusSec();
      navigator.mediaSession.metadata = new MediaMetadata({
        title: running ? "Concentrating" : "Paused",
        artist: `Today ${fmtDur(today)} · ${dday(new Date())}`,
        album: "CFA Level 2",
        artwork: [{ src: "icons/icon-512.png?v=13", sizes: "512x512", type: "image/png" }]
      });
      if (running) silentAudio.play().catch(() => {}); else silentAudio.pause();
      navigator.mediaSession.playbackState = running ? "playing" : "paused";
      // The lock screen counts the position up by itself while "playing".
      if (navigator.mediaSession.setPositionState)
        navigator.mediaSession.setPositionState({ duration: 24 * 3600, playbackRate: 1, position: Math.min(today, 24 * 3600 - 1) });
    } catch {}
  }
  let refreshFocus = () => {};

  let toastTimer = null;
  function toast(text) {
    let t = document.querySelector(".toast");
    if (!t) { t = el("div", { className: "toast" }); document.body.append(t); }
    t.textContent = text;
    requestAnimationFrame(() => t.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  // Show a time like "1:02:37" digit by digit; a digit that changes crossfades to the new value in place.
  function rollTo(box, text) {
    if (!box || box.dataset.value === text) return;
    const animate = box.dataset.value !== undefined && box.dataset.value.length === text.length;
    if (!animate) {
      box.textContent = "";
      [...text].forEach(ch => {
        if (ch === ":") return box.append(el("span", {}, ":"));
        const slot = el("span", { className: "slot" });
        slot.append(el("span", { className: "sizer" }, "0"), el("span", { className: "dg" }, ch));
        box.append(slot);
      });
    } else {
      [...text].forEach((ch, k) => {
        const slot = box.children[k];
        if (ch === ":" || !slot.classList.contains("slot")) return;
        const cur = slot.querySelector(".dg:not(.above)");
        if (cur.textContent === ch) return;
        const next = el("span", { className: "dg below" }, ch);
        slot.append(next);
        cur.classList.add("above");
        setTimeout(() => cur.remove(), 850);
        requestAnimationFrame(() => requestAnimationFrame(() => next.classList.remove("below")));
      });
    }
    box.dataset.value = text;
  }

  // Refresh every live number on screen (timer and home tiles).
  function updateStudyDisplays() {
    const s = loadStudy(), run = runningSec(), today = daySec(s, dkey(new Date()));
    const set = (id, text) => { const e = document.getElementById(id); if (e && e.textContent !== text) e.textContent = text; };
    rollTo(document.getElementById("sw-time"), hms(todayFocusSec(s)));
    const ht = document.getElementById("home-timer");
    if (ht) {
      const text = s.timer.since ? `Concentrating · ${hms(todayFocusSec(s))}` : `Today ${fmtDur(today)}`;
      if (ht.dataset.text !== text) {
        ht.dataset.text = text;
        ht.textContent = "";
        if (s.timer.since) ht.append(el("span", { className: "live-dot" }));
        ht.append(text);
      }
    }
    set("home-dday", `${dday(new Date())} · Exam 20 Nov`);
    if (document.getElementById("home-garden")) set("home-garden", gardenHomeInfo());
  }
  setInterval(updateStudyDisplays, 200); // often enough that each second rolls over on time
  document.addEventListener("visibilitychange", () => { if (!document.hidden) updateStudyDisplays(); });

  function studyTimer() {
    document.querySelectorAll(".focus").forEach(f => f.remove());
    const page = el("div", { className: "focus" });
    const close = el("button", { className: "focus-close" }, "‹ Menu");
    const time = el("div", { className: "focus-time", id: "sw-time" });
    rollTo(time, hms(todayFocusSec()));
    const btn = el("button", { className: "focus-btn" });
    btn.append(el("span", { className: "lbl go" }, "Concentrate"), el("span", { className: "lbl pause" }, "Pause"));
    page.append(close, time, btn);
    document.body.append(page);
    refreshFocus = () => { page.classList.toggle("running", !!loadStudy().timer.since); updateStudyDisplays(); };
    refreshFocus();
    requestAnimationFrame(() => page.classList.add("show"));
    btn.onclick = () => { toggleStudy(); refreshFocus(); };
    close.onclick = () => {
      refreshFocus = () => {};
      page.classList.remove("show");
      setTimeout(() => page.remove(), 500);
      home("back");
    };
    // If the timer was already running (e.g. the app was reopened), reconnect the lock screen on the next tap.
    if (loadStudy().timer.since) page.addEventListener("pointerdown", () => lockScreen(!!loadStudy().timer.since), { once: true });
  }

  let calMonth = null; // index into CAL_MONTHS
  function calendar(dir = "fwd") {
    screen(dir);
    const now = new Date();
    if (calMonth === null) {
      const idx = CAL_MONTHS.findIndex(([y, m]) => y === now.getFullYear() && m === now.getMonth());
      calMonth = idx >= 0 ? idx : now < new Date(2026, 8, 1) ? 0 : CAL_MONTHS.length - 1;
    }
    app.append(nav("Menu", () => home("back")));

    // D-day in the top-left corner, month total on the right. This card never animates when switching months.
    const head = el("div", { className: "card cal-head" });
    const left = el("div");
    left.append(el("p", { className: "kicker" }, "CFA Level 2 exam"), el("div", { className: "dday-num" }, dday(now)),
      el("div", { className: "dday-sub" }, "Fri, 20 November 2026 · 14:30"));
    const right = el("div", { className: "month-total" });
    const monthLabel = el("span", { className: "cnt" }), monthVal = el("b"), allVal = el("span", { className: "cnt" });
    right.append(monthLabel, monthVal, allVal);
    head.append(left, right);

    const calCard = el("div", { className: "card" });
    const seg = el("div", { className: "seg" });
    const segBtns = CAL_MONTHS.map(([y, m], idx) => {
      const b = el("button", {}, MONTHS[m].slice(0, 3));
      b.onclick = () => goMonth(idx);
      seg.append(b);
      return b;
    });
    const top = el("div", { style: "display:flex;justify-content:flex-end;margin-bottom:10px" });
    top.append(seg);
    const view = el("div", { className: "month-view" });
    calCard.append(top, view);
    app.append(head, calCard);

    function setTotals() {
      const s = loadStudy(), [year, month] = CAL_MONTHS[calMonth];
      const prefix = `${year}-${String(month + 1).padStart(2, "0")}`;
      monthLabel.textContent = `Studied in ${MONTHS[month]}`;
      monthVal.textContent = fmtDur(Object.keys(s.days).filter(k => k.startsWith(prefix)).reduce((n, k) => n + daySec(s, k), 0));
      allVal.textContent = `Total ${fmtDur(Object.keys(s.days).reduce((n, k) => n + daySec(s, k), 0))}`;
      segBtns.forEach((b, idx) => b.classList.toggle("on", idx === calMonth));
    }

    let busy = false;
    function goMonth(idx) {
      if (idx === calMonth || idx < 0 || idx >= CAL_MONTHS.length || busy) return;
      busy = true;
      const forward = idx > calMonth;
      calMonth = idx;
      setTotals();
      const old = view.firstChild, next = monthPanel(calMonth);
      view.style.height = `${view.offsetHeight}px`;
      old.classList.add("leaving", forward ? "to-left" : "to-right");
      next.classList.add(forward ? "from-right" : "from-left");
      view.append(next);
