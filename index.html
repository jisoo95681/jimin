<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CFA Quiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f5bd3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>CFA Concept Quiz</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #e2e2e0; --accent: #2f5bd3; --good: #1e8e3e; --bad: #c5221f;
    --good-bg: #e6f4ea; --bad-bg: #fce8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517; --card: #202024; --text: #ececef; --muted: #9a9aa2;
      --border: #34343a; --accent: #7d9cff; --good: #6fcf8a; --bad: #f28b82;
      --good-bg: #1d3325; --bad-bg: #3a1f1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  }
  main {
    max-width: 640px; margin: 0 auto;
    padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .q { font-weight: 600; margin: 0 0 16px; }
  .opt {
    display: block; width: 100%; text-align: left; margin: 0 0 10px; padding: 12px 14px;
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; font: inherit; cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .why { margin-top: 6px; padding: 12px 14px; border-left: 3px solid var(--accent); color: var(--text); font-size: .95rem; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  .btn {
    padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font: inherit; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .progress { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .score { font-size: 2rem; font-weight: 700; margin: 0 0 8px; }
  .miss { margin: 12px 0 0; padding-left: 18px; }
  .miss li { margin-bottom: 8px; }
  .card + .card { margin-top: 16px; }
  .note { border-top: 1px solid var(--border); padding: 14px 0; }
  .note:first-of-type { border-top: 0; }
  .note .ans { color: var(--good); font-weight: 600; margin: 6px 0; }
  .note .small { color: var(--muted); font-size: .85rem; }
  .link { background: none; border: 0; padding: 0; color: var(--bad); font: inherit; font-size: .85rem; cursor: pointer; margin-left: 8px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.small { padding: 6px 14px; font-size: .9rem; }
  [hidden] { display: none !important; }
  .label { font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font: inherit; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip:disabled { opacity: .35; cursor: default; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 1.05rem; }
  .ver { color: var(--muted); font-size: .75rem; text-align: center; margin-top: 24px; }
  @media print {
    body { background: #fff; color: #000; }
    .row, .link, .progress, .ver { display: none !important; }
    .card { border: 0; padding: 0; }
    .note { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <h1>CFA L2 Concept Quiz (개념)</h1>
  <p class="sub">Intercorporate Investments · Forward Commitments</p>
  <div id="app"></div>
  <p class="ver" id="ver"></p>
</main>
<script src="questions.js"></script>
<script>
  const app = document.getElementById("app");
  const LETTERS = ["A", "B", "C", "D"];
  const STORE_KEY = "cfa-quiz-wrong";
  const PREFS_KEY = "cfa-quiz-prefs";
  const APP_VERSION = "v4 · 2026-09-25";
  const COUNTS = [5, 10, 15, 20];
  let deck = [], i = 0, score = 0, missed = [], reviewMode = false;
  let inQuiz = false, paused = false, answeredCurrent = false;

  // Timer: counts only while a quiz is running and not paused.
  let elapsed = 0, runningSince = null;
  function timerReset() { elapsed = 0; runningSince = Date.now(); }
  function timerPause() { if (runningSince) { elapsed += Date.now() - runningSince; runningSince = null; } }
  function timerResume() { if (!runningSince) runningSince = Date.now(); }
  function timeMs() { return elapsed + (runningSince ? Date.now() - runningSince : 0); }
  function fmt(ms) {
    const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    const pad = n => String(n).padStart(2, "0");
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  }
  setInterval(() => {
    const t = document.getElementById("timer");
    if (t) t.textContent = `⏱ ${fmt(timeMs())}`;
  }, 250);

  function loadPrefs() {
    try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; }
  }
  function savePrefs(p) {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch {}
  }

  // Wrong-answer notebook (오답 노트), saved on this device: { [question text]: { count, last } }
  function loadWrong() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  }
  function saveWrong(w) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(w)); } catch {}
  }
  function today() { return new Date().toLocaleDateString("en-CA"); }
  function wrongList() {
    const w = loadWrong();
    return QUESTIONS.filter(q => w[q.q]).sort((a, b) => w[b.q].count - w[a.q].count);
  }
  function record(q, correct) {
    const w = loadWrong();
    if (!correct) w[q.q] = { count: ((w[q.q] && w[q.q].count) || 0) + 1, last: today() };
    else if (reviewMode) delete w[q.q]; // got it right while reviewing → it leaves the notebook
    saveWrong(w);
  }

  function shuffle(a) {
    a = a.slice();
    for (let k = a.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [a[k], a[j]] = [a[j], a[k]];
    }
    return a;
  }

  function el(tag, attrs = {}, text) {
    const e = document.createElement(tag);
    Object.assign(e, attrs);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function start() {
    const topics = [...new Set(QUESTIONS.map(q => q.topic))];
    app.innerHTML = "";
    const card = el("div", { className: "card" });
    const prefs = loadPrefs();
    card.append(el("p", { className: "q" }, `${QUESTIONS.length} concept questions`));

    card.append(el("p", { className: "label" }, "Topic"));
    const sel = el("select");
    sel.append(el("option", { value: "" }, "All topics"));
    topics.forEach(t => sel.append(el("option", { value: t }, t)));
    if (topics.includes(prefs.topic)) sel.value = prefs.topic;
    card.append(sel);

    // How many questions: 5 / 10 / 15 / 20 / All (options larger than the topic's pool are disabled).
    card.append(el("p", { className: "label" }, "How many questions"));
    const chips = el("div", { className: "chips" });
    let count = prefs.count || "all";
    const pool = () => QUESTIONS.filter(q => !sel.value || q.topic === sel.value);
    function drawChips() {
      chips.innerHTML = "";
      const size = pool().length;
      if (count !== "all" && count >= size) count = "all";
      [...COUNTS, "all"].forEach(c => {
        const b = el("button", { className: "chip" + (c === count ? " on" : "") }, c === "all" ? `All (${size})` : String(c));
        b.disabled = c !== "all" && c >= size;
        b.onclick = () => { count = c; drawChips(); };
        chips.append(b);
      });
    }
    sel.onchange = drawChips;
    drawChips();
    card.append(chips);

    const row = el("div", { className: "row" });
    const shuf = el("label");
    const cb = el("input", { type: "checkbox", checked: prefs.shuffle !== false });
    shuf.append(cb, " Shuffle");
    const go = el("button", { className: "btn" }, "Start");
    go.onclick = () => {
      savePrefs({ topic: sel.value, count, shuffle: cb.checked });
      let qs = cb.checked ? shuffle(pool()) : pool();
      if (count !== "all") qs = qs.slice(0, count);
      begin(qs);
    };
    row.append(go, shuf);
    card.append(row);

    const n = wrongList().length;
    const notesCard = el("div", { className: "card" });
    notesCard.append(el("p", { className: "q" }, `오답 노트 · Wrong answers (${n})`));
    notesCard.append(el("p", { className: "sub" }, n
      ? "Every question you miss is saved here. Review it, practice it, or save it as a file."
      : "Questions you get wrong will be saved here."));
    const open = el("button", { className: "btn", disabled: !n }, "Open 오답 노트");
    open.onclick = notes;
    const nrow = el("div", { className: "row" });
    nrow.append(open);
    notesCard.append(nrow);
    app.append(card, notesCard);
  }

  function notes() {
    const list = wrongList(), w = loadWrong();
    app.innerHTML = "";
    const card = el("div", { className: "card" });
    card.append(el("p", { className: "q" }, `오답 노트 · ${list.length} question${list.length === 1 ? "" : "s"}`));

    const top = el("div", { className: "row" });
    const practice = el("button", { className: "btn", disabled: !list.length }, "Practice these");
    practice.onclick = () => begin(shuffle(list), true);
    const file = el("button", { className: "btn ghost", disabled: !list.length }, "Save as file");
    file.onclick = saveFile;
    const pdf = el("button", { className: "btn ghost", disabled: !list.length }, "Print / PDF");
    pdf.onclick = () => window.print();
    const back = el("button", { className: "btn ghost" }, "Back");
    back.onclick = start;
    top.append(practice, file, pdf, back);
    card.append(top);

    list.forEach((q, n) => {
      const item = el("div", { className: "note" });
      const meta = el("div", { className: "small" }, `${n + 1}. ${q.topic} · missed ${w[q.q].count}× · last ${w[q.q].last}`);
      const rm = el("button", { className: "link" }, "Remove");
      rm.onclick = () => { const x = loadWrong(); delete x[q.q]; saveWrong(x); notes(); };
      meta.append(rm);
      item.append(meta, el("p", { className: "q" }, q.q));
      item.append(el("p", { className: "ans" }, `✓ ${q.options[q.answer]}`));
      item.append(el("div", { className: "why" }, q.why));
      card.append(item);
    });

    if (list.length) {
      const bottom = el("div", { className: "row" });
      const clear = el("button", { className: "btn ghost" }, "Clear all");
      clear.onclick = () => { if (confirm("Delete every question from your 오답 노트?")) { saveWrong({}); start(); } };
      bottom.append(clear);
      card.append(bottom);
    }
    app.append(card);
  }

  function notesText() {
    const w = loadWrong();
    let out = `CFA L2 오답 노트 (Wrong Answers)\nSaved ${today()}\n`;
    wrongList().forEach((q, n) => {
      out += `\n${n + 1}. [${q.topic}] missed ${w[q.q].count}x, last ${w[q.q].last}\n`;
      out += `Q: ${q.q}\n`;
      q.options.forEach((o, k) => (out += `   ${LETTERS[k]}. ${o}\n`));
      out += `Answer: ${LETTERS[q.answer]}. ${q.options[q.answer]}\n`;
      out += `Why: ${q.why}\n`;
    });
    return out;
  }

  async function saveFile() {
    const name = `CFA-wrong-answers-${today()}.txt`;
    const file = new File([notesText()], name, { type: "text/plain" });
    // On iPhone/iPad this opens the Share sheet → Save to Files, Notes, Goodnotes, AirDrop…
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "CFA 오답 노트" }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    const a = el("a", { href: URL.createObjectURL(file), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function begin(questions, review = false) {
    deck = questions; i = 0; score = 0; missed = []; reviewMode = review;
    inQuiz = true; paused = false;
    timerReset();
    show();
  }

  function pause() {
    if (!inQuiz || paused) return;
    paused = true;
    timerPause();
    document.getElementById("quiz").hidden = true;
    const answered = i + (answeredCurrent ? 1 : 0);
    const card = el("div", { className: "card", id: "paused" });
    card.append(el("p", { className: "score" }, "Paused"));
    card.append(el("p", { className: "sub" }, `Time so far ${fmt(timeMs())} · ${answered} of ${deck.length} answered · Score ${score}`));
    const row = el("div", { className: "row" });
    const resume = el("button", { className: "btn" }, "Resume");
    resume.onclick = () => {
      card.remove();
      document.getElementById("quiz").hidden = false;
      paused = false;
      timerResume();
    };
    const quit = el("button", { className: "btn ghost" }, "Quit");
    quit.onclick = () => (answered ? results(answered) : endQuiz(start));
    row.append(resume, quit);
    card.append(row);
    app.append(card);
  }

  function endQuiz(next) {
    inQuiz = false; paused = false;
    timerPause();
    next();
  }

  // Leaving the app (home button, switching apps) pauses the quiz and the timer.
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

  function show() {
    const q = deck[i];
    answeredCurrent = false;
    app.innerHTML = "";
    const quiz = el("div", { id: "quiz" });
    const top = el("div", { className: "topbar" });
    const pauseBtn = el("button", { className: "btn ghost small" }, "❚❚ Pause");
    pauseBtn.onclick = pause;
    top.append(el("span", { className: "timer", id: "timer" }, `⏱ ${fmt(timeMs())}`), pauseBtn);
    const bar = el("div", { className: "progress" });
    const fill = el("div");
    fill.style.width = `${(i / deck.length) * 100}%`;
    bar.append(fill);
    const card = el("div", { className: "card" });
    const meta = el("div", { className: "meta" });
    meta.append(el("span", {}, reviewMode ? `오답 노트 · ${q.topic}` : q.topic), el("span", {}, `${i + 1} / ${deck.length} · Score ${score}`));
    card.append(meta, el("p", { className: "q" }, q.q));

    // Shuffle the choices so the correct letter isn't predictable.
    const order = shuffle(q.options.map((_, k) => k));
    const buttons = order.map((k, pos) => {
      const b = el("button", { className: "opt" }, `${LETTERS[pos]}. ${q.options[k]}`);
      b.dataset.k = k;
      b.onclick = () => answer(k, buttons, card);
      card.append(b);
      return b;
    });
    quiz.append(top, bar, card);
    app.append(quiz);
  }

  function answer(k, buttons, card) {
    const q = deck[i];
    answeredCurrent = true;
    buttons.forEach(b => (b.disabled = true));
    const byK = k2 => buttons.find(b => +b.dataset.k === k2);
    byK(q.answer).classList.add("correct");
    if (k === q.answer) score++;
    else { byK(k).classList.add("wrong"); missed.push(q); }
    record(q, k === q.answer);
    card.append(el("div", { className: "why" }, q.why));
    const row = el("div", { className: "row" });
    const next = el("button", { className: "btn" }, i + 1 < deck.length ? "Next" : "See results");
    next.onclick = () => { i++; i < deck.length ? show() : results(); };
    row.append(next);
    card.append(row);
    next.focus();
  }

  function results(answered = deck.length) {
    endQuiz(() => {});
    const total = timeMs();
    app.innerHTML = "";
    const card = el("div", { className: "card" });
    if (answered < deck.length) card.append(el("p", { className: "sub" }, `Quit early: ${answered} of ${deck.length} answered`));
    card.append(el("p", { className: "score" }, `${score} / ${answered}`));
    const pct = Math.round((score / answered) * 100);
    card.append(el("p", { className: "sub" }, `${pct}% correct`));
    card.append(el("p", { className: "sub" }, `⏱ ${fmt(total)} total · ${fmt(total / answered)} per question`));
    card.append(el("p", { className: "sub" }, reviewMode
      ? `${score} question${score === 1 ? "" : "s"} you got right left your 오답 노트. ${wrongList().length} still there.`
      : missed.length ? `${missed.length} added to your 오답 노트.` : "Nothing new for your 오답 노트."));
    if (missed.length) {
      card.append(el("p", { className: "q" }, "Review what you missed:"));
      const ul = el("ul", { className: "miss" });
      missed.forEach(q => ul.append(el("li", {}, `${q.q} → ${q.options[q.answer]}`)));
      card.append(ul);
    }
    const row = el("div", { className: "row" });
    if (missed.length) {
      const retry = el("button", { className: "btn" }, "Retry missed");
      retry.onclick = () => begin(shuffle(missed), reviewMode);
      row.append(retry);
    }
    const nb = el("button", { className: "btn ghost", disabled: !wrongList().length }, "오답 노트");
    nb.onclick = notes;
    row.append(nb);
    const home = el("button", { className: "btn ghost" }, "Start over");
    home.onclick = start;
    row.append(home);
    card.append(row);
    app.append(card);
  }

  document.getElementById("ver").textContent = APP_VERSION;
  start();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
