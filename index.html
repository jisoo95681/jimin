    view.append(monthPanel(calMonth));
  }

  function monthPanel(idx) {
    const s = loadStudy(), now = new Date(), [year, month] = CAL_MONTHS[idx];
    const panel = el("div", { className: "month-panel" });
    panel.append(el("h2", { style: "margin:0 0 14px;font-size:1.25rem" }, `${MONTHS[month]} ${year}`));
    const grid = el("div", { className: "cal-grid" });
    DOW.forEach(d => grid.append(el("div", { className: "dow" }, d)));
    const first = new Date(year, month, 1), days = new Date(year, month + 1, 0).getDate();
    for (let k = 0; k < first.getDay(); k++) grid.append(el("div", { className: "day blank" }));
    const todayKey = dkey(now), examKey = dkey(EXAM);
    for (let d = 1; d <= days; d++) {
      const date = new Date(year, month, d), key = dkey(date), data = s.days[key] || { tasks: [], sessions: [] };
      const sec = daySec(s, key) + (key === todayKey ? runningSec() : 0);
      const cell = el("button", { className: "day" + (key === todayKey ? " today" : "") + (key === examKey ? " exam" : "") + (date < midnight(now) ? " past" : "") });
      const topRow = el("div", { style: "display:flex;align-items:center" });
      topRow.append(el("span", { className: "d" }, String(d)));
      if (data.tasks.length) topRow.append(el("span", { className: "dot" }));
      cell.append(topRow);
      data.tasks.filter(t => splitGroup(t.text).t !== "—").slice(0, 2).forEach(t => { const x = splitGroup(t.text); cell.append(el("span", { className: "task" + (t.done ? " done" : "") }, x.g ? `${x.g.split(" ")[0]} · ${x.t}` : x.t)); });
      const shown = data.tasks.filter(t => splitGroup(t.text).t !== "—").length;
      if (shown > 2) cell.append(el("span", { className: "task" }, `+${shown - 2} more`));
      if (key === examKey) cell.append(el("span", { className: "tag" }, "EXAM 14:30"));
      else if (sec > 0) cell.append(el("span", { className: "hrs" }, fmtShort(sec)));
      // Tint days by how much was studied (darker aqua = more hours).
      if (sec > 0 && key !== examKey) cell.style.background = `rgba(187, 233, 233, ${Math.min(1, .25 + sec / 3600 / 8)})`;
      cell.onclick = () => dayView(key);
      grid.append(cell);
    }
    panel.append(grid);
    return panel;
  }

  function dayView(key, dir = "fwd") {
    screen(dir);
    const date = fromKey(key), isToday = key === dkey(new Date());
    app.append(nav("Calendar", () => calendar("back")));
    app.append(el("h1", { className: "title" }, date.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" })),
      el("p", { className: "sub" }, `${dday(date)} · ${key === dkey(EXAM) ? "Exam day, 14:30" : "until the exam"}`));

    // Plan: what you will work on that day. Tasks written as "[AM 08:30–11:00] text" are shown session by session.
    const plan = el("div");
    function drawPlan() {
      const s = loadStudy(), tasks = (s.days[key] || {}).tasks || [];
      plan.innerHTML = "";
      const rows = tasks.map((t, idx) => ({ ...splitGroup(t.text), done: t.done, idx }));
      const grouped = rows.some(r => r.g);
      const addTask = (text, remove) => {
        const st = loadStudy(), day = dayOf(st, key);
        if (remove) day.tasks = day.tasks.filter(t => t.text !== remove);
        day.tasks.push({ text, done: false }); saveStudy(st); drawPlan();
      };
      const taskRow = r => {
        const row = el("div", { className: "task-row" + (r.done ? " done" : "") });
        const cb = el("input", { type: "checkbox", checked: r.done });
        cb.onchange = () => { const st = loadStudy(); dayOf(st, key).tasks[r.idx].done = cb.checked; saveStudy(st); drawPlan(); };
        const del = el("button", { className: "x", ariaLabel: "Delete task" }, "×");
        del.onclick = () => { const st = loadStudy(); dayOf(st, key).tasks.splice(r.idx, 1); saveStudy(st); drawPlan(); };
        row.append(cb, el("span", {}, r.t), del);
        return row;
      };
      const addForm = (placeholder, onAdd) => {
        const add = el("form", { className: "row", style: "margin-top:12px;flex-wrap:nowrap" });
        const input = el("input", { className: "field grow", placeholder });
        add.append(input, el("button", { className: "btn", type: "submit" }, "Add"));
        add.onsubmit = e => { e.preventDefault(); const text = input.value.trim(); if (text) onAdd(text); };
        return add;
      };

        const card = el("div", { className: "card" });

        if (!tasks.length) card.append(el("p", { className: "sub", style: "margin:0 0 6px" }, "Nothing planned yet."));
        rows.forEach(r => card.append(taskRow(r)));
        card.append(addForm("Add a task, e.g. FSA reading 13 + practice", text => addTask(text)));
        plan.append(card);
        return;
      }
      // Session by session: one coloured card per session, with its time, a progress bar and its own add button.
      const groups = [];
      rows.forEach(r => { let g = groups.find(x => x.g === r.g); if (!g) groups.push(g = { g: r.g, rows: [] }); g.rows.push(r); });
      groups.forEach(g => {
        const name = g.g ? g.g.split(" ")[0] : "Anytime", time = g.g ? g.g.slice(name.length).trim() : "";
        const real = g.rows.filter(r => r.t !== "—"), done = real.filter(r => r.done).length;
        const card = el("div", { className: "card sg" + (real.length && done === real.length ? " all-done" : "") });
        card.style.setProperty("--sc", GROUP_COLORS[name] || "#2f678e");
        const head = el("div", { className: "sg-head" });
        head.append(el("span", { className: "sg-name" }, name), el("span", { className: "sg-time" }, time), el("span", { className: "sg-count" }, real.length ? `${done}/${real.length}` : "empty"));
        card.append(head);
        const bar = el("div", { className: "nt-bar" }), fill = el("div"); fill.style.width = `${real.length ? Math.round(done / real.length * 100) : 0}%`;
        bar.append(fill); card.append(bar);
        if (!real.length) card.append(el("p", { className: "sub", style: "margin:10px 0 0;font-style:italic" }, "Empty for now"));
        real.forEach(r => card.append(taskRow(r)));
        const placeholder = g.rows.find(r => r.t === "—");
        const more = el("button", { className: "link-btn" }, "+ Add to this session");
        const holder = el("div");
        more.onclick = () => {
          more.remove();
          const f = addForm("Add a task", text => addTask(g.g ? `[${g.g}] ${text}` : text, placeholder ? `[${g.g}] —` : null));
          holder.append(f); f.querySelector(".field").focus();

        card.append(more, holder);

      const extra = el("div", { className: "card" });
      extra.append(el("p", { className: "kicker" }, "Add a task"), addForm("Add a task", text => addTask(text)));
      plan.append(extra);

    // Study time: timer sessions plus any time added by hand; everything adds up.
    const time = el("div", { className: "card" });
    function drawTime() {
      const s = loadStudy(), list = (s.days[key] || {}).sessions || [];
      time.innerHTML = "";
      time.append(el("p", { className: "kicker" }, "Hours studied"), el("p", { className: "big-total" }, fmtDur(daySec(s, key))));
      if (isToday && s.timer.since) time.append(el("p", { className: "sub", style: "margin:4px 0 0" }, `Timer running: ${fmtDur(runningSec())} so far, added when you pause.`));
      const box = el("div", { style: "margin-top:10px" });

        const row = el("div", { className: "sess" });
        row.append(el("span", { className: "when" }, x.manual ? "Added manually" : `${clock(x.start)} – ${clock(x.end)}`),
          el("span", { className: "dur" }, fmtDur(x.sec) === "0m" ? `${x.sec}s` : fmtDur(x.sec)));
        const del = el("button", { className: "x", ariaLabel: "Delete session" }, "×");
        del.onclick = () => { if (confirm("Delete this session?")) { const st = loadStudy(); st.days[key].sessions.splice(idx, 1); saveStudy(st); drawTime(); } };
        row.append(del);
        box.append(row);
      });
      time.append(box);
      time.append(el("p", { className: "label" }, "Add time manually"));
      const add = el("form", { className: "row", style: "margin-top:0" });
      const h = el("input", { className: "field small", type: "number", min: 0, max: 24, placeholder: "h", inputMode: "numeric" });
      const m = el("input", { className: "field small", type: "number", min: 0, max: 59, placeholder: "min", inputMode: "numeric" });
      add.append(h, el("span", { className: "cnt" }, "h"), m, el("span", { className: "cnt" }, "min"), el("button", { className: "btn", type: "submit" }, "Add"));
      add.onsubmit = e => {
        e.preventDefault();
        const sec = (Math.max(0, +h.value || 0) * 60 + Math.max(0, +m.value || 0)) * 60;
        if (!sec) return;
        const st = loadStudy(); dayOf(st, key).sessions.push({ start: date.getTime(), end: date.getTime(), sec, manual: true }); saveStudy(st);

    }
    drawPlan();
    drawTime();
    app.append(plan, time);
    if (isToday) {

  }

  // ---------- Running a quiz (both flows) ----------
  function startRun() {
    i = 0; score = 0; missed = [];
    inQuiz = true; paused = false;
    timerReset();
  }

  function answeredCount() {
    if (flow === "vignette")
      return qCount(vdeck.slice(0, vi)) + (checkedCurrent ? vdeck[vi].questions.length : 0);
    return sq.filter(x => x.pick !== null).length;
  }

  function topbar() {
    const top = el("div", { className: "topbar" });

    pauseBtn.onclick = pause;

    clocks.append(el("span", { className: "timer", id: "timer" }, `⏱ ${fmt(timeMs())}`));
    if (flow === "single") clocks.lastChild.textContent = `Total ${fmt(timeMs())}`;

  function progress(frac) {
    const bar = el("div", { className: "progress" });
    const fill = el("div");
    fill.style.width = `${frac * 100}%`;

  }

  function pause() {
    if (!inQuiz || paused) return;
    paused = true;
    timerPause();
    const qz = document.getElementById("quiz") || document.querySelector(".mark-ask");
    if (qz) qz.hidden = true;
    const answered = answeredCount();
    const card = el("div", { className: "card", id: "paused" });
    card.style.animation = "fade-up .35s var(--ease)";
    card.append(el("p", { className: "score" }, "Paused"));
    const where = flow === "vignette" ? `Vignette ${vi + 1} of ${vdeck.length} · ` : "";
    card.append(el("p", { className: "sub" }, flow === "single" ? `Time so far ${fmt(timeMs())} · ${answered} of ${deck.length} answered` : `Time so far ${fmt(timeMs())} · ${where}${answered} of ${deck.length} answered · Score ${score}`));
    const row = el("div", { className: "row" });
    const resume = el("button", { className: "btn" }, "Resume");
    resume.onclick = () => {
      card.remove();
      if (qz) qz.hidden = false;
      paused = false;
      timerResume();
    };
    const quit = el("button", { className: "btn ghost" }, "Quit");
    quit.onclick = () => (flow === "single" ? (answered ? (card.remove(), paused = false, timerResume(), confirmMark(false)) : endQuiz(backTo)) : answered ? results(answered) : endQuiz(backTo));
    if (flow === "single" && answered) quit.textContent = "Finish & mark";
    row.append(resume, quit);
    card.append(row);
    app.append(card);
    window.scrollTo(0, 0);
  }

  function endQuiz(next) {
    inQuiz = false; paused = false;
    timerPause();
    next();
  }

  // Leaving the app (home button, switching apps) pauses the quiz and the timer.
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

  // Single flow (quick questions, incorrect-question practice, retry missed): answer in any order, skip and come back,
  // go back and change an answer. Nothing is revealed until the whole set is marked.
  let sq = []; // per question: { order, pick (null = not answered), skipped, ms }
  let qEnter = 0;
  let trackSet = false; // a quick-question set started from the setup screens goes on the progression tracker
  function begin(questions, review = false, track = false) {
    flow = "single"; deck = questions; reviewMode = review; trackSet = track;
    startRun();
    sq = deck.map(q => ({ order: q.vignette ? q.options.map((_, k) => k) : shuffle(q.options.map((_, k) => k)), pick: null, skipped: false, ms: 0 }));
    qEnter = timeMs();
    show("fwd");
  }
  const qTimeMs = () => (sq[i] ? sq[i].ms + (inQuiz ? timeMs() - qEnter : 0) : 0);
  function leaveQuestion() { if (sq[i]) sq[i].ms += timeMs() - qEnter; qEnter = timeMs(); }
  function goTo(n, dir) { leaveQuestion(); i = n; show(dir, true); }
  // The next question still to do after the current one (wrapping round), or -1 when all are answered.
  function nextOpen(from) {
    for (let d = 1; d <= deck.length; d++) { const n = (from + d) % deck.length; if (sq[n].pick === null) return n; }
    return -1;
  }

  // inPlace (moving between questions): the timer bar, number map and mark button stay put; only the question card slides.
  function show(dir = "fwd", inPlace = false) {
    const q = deck[i], st = sq[i];
    answeredCurrent = st.pick !== null;
    const old = inPlace && document.getElementById("quiz");
    if (!old) screen(dir);
    const quiz = el("div", { id: "quiz" });
    const card = el("div", { className: "card" });
    const done = sq.filter(s => s.pick !== null).length;
    const meta = el("div", { className: "meta" });
    meta.append(el("span", {}, reviewMode ? `Review · ${qLabel(q)}` : qLabel(q)), el("span", {}, `Question ${i + 1} of ${deck.length} · ${done} answered`));
    card.append(meta);
    if (q.vignette) card.append(vignetteDetails(q.vignette));
    card.append(el("p", { className: "q" }, q.q));
    const buttons = st.order.map((k, pos) => {
      const b = el("button", { className: "opt" + (st.pick === k ? " sel" : "") }, `${LETTERS[pos]}. ${q.options[k]}`);
      b.onclick = () => {
        st.pick = st.pick === k ? null : k; // tap again to clear
        st.skipped = false;
        buttons.forEach((x, p) => x.classList.toggle("sel", st.order[p] === st.pick));
        drawNav();
      };
      card.append(b);
      return b;
    });

    // Previous · Skip / Next
    const row = el("div", { className: "row qnav-row" });
    const prev = el("button", { className: "btn ghost" }, "← Previous");
    prev.disabled = i === 0;
    prev.onclick = () => goTo(i - 1, "back");
    const fwd = el("button", { className: "btn" });
    const setFwd = () => { fwd.textContent = st.pick === null ? "Skip for now →" : "Next →"; fwd.classList.toggle("ghost", st.pick === null); };
    fwd.onclick = () => {
      if (st.pick === null) st.skipped = true;
      const n = i + 1 < deck.length && sq[i + 1].pick === null ? i + 1 : nextOpen(i);
      if (n === -1) { leaveQuestion(); confirmMark(true); }
      else goTo(n, n > i ? "fwd" : "back");
    };
    row.append(prev, fwd);
    card.append(row);

    // Question map: tap a number to jump; answered ones are filled, skipped ones outlined in amber.
    const map = el("div", { className: "qmap" });
    function drawNav() {
      setFwd();
      map.innerHTML = "";
      sq.forEach((s, n) => {
        const b = el("button", { className: "qdot" + (s.pick !== null ? " done" : s.skipped ? " skip" : "") + (n === i ? " cur" : "") }, String(n + 1));
        b.onclick = () => n !== i && goTo(n, n > i ? "fwd" : "back");
        map.append(b);
      });
      const left = sq.filter(s => s.pick === null).length;
      markBtn.textContent = left ? `Mark the question set (${left} unanswered)` : "Mark the question set";
    }
    const markBtn = el("button", { className: "btn mark-btn" });
    markBtn.onclick = () => { leaveQuestion(); confirmMark(false); };
    drawNav();
    if (old) {
      // Same card, new content: the old question slides out, the card eases to its new height, the new one slides in.
      const oldCard = old.querySelector(":scope > .card");
      const fill = old.querySelector(":scope > .progress > div");
      if (fill) fill.style.width = `${(done / deck.length) * 100}%`;
      old.querySelector(":scope > .qmap").replaceWith(map);
      old.querySelector(":scope > .mark-btn").replaceWith(markBtn);
      const inner = el("div", { className: "card-inner" });
      inner.append(...card.childNodes);
      const shift = dir === "back" ? 18 : -18, ease = "cubic-bezier(.22, .8, .24, 1)";
      const swap = () => {
        oldCard._out = null;
        const h0 = oldCard.offsetHeight;
        oldCard.replaceChildren(inner);
        const h1 = oldCard.offsetHeight;
        if (oldCard._grow) oldCard._grow.cancel();
        if (h0 !== h1) oldCard._grow = oldCard.animate([{ height: `${h0}px` }, { height: `${h1}px` }], { duration: 260, easing: ease });
        inner.animate([{ opacity: 0, transform: `translateX(${-shift}px)` }, { opacity: 1, transform: "none" }], { duration: 260, easing: ease });
        if (oldCard.getBoundingClientRect().top < 0) window.scrollTo({ top: 0, behavior: "smooth" });
      };
      if (oldCard._out) { oldCard._out.cancel(); swap(); return; } // tapped again mid-slide: jump straight to the newest question
      const cur = oldCard.firstElementChild;
      if (!cur || !cur.classList.contains("card-inner")) { swap(); return; }
      oldCard._out = cur.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${shift}px)` }], { duration: 130, easing: "ease-in", fill: "forwards" });
      oldCard._out.onfinish = swap;
      return;
    }
    const inner0 = el("div", { className: "card-inner" });
    inner0.append(...card.childNodes);
    card.append(inner0);
    quiz.append(topbar(), progress(done / deck.length), card, map, markBtn);
    app.append(quiz);
  }

  // How far through the set you got: up to the furthest question you answered or skipped. Marking early scores you
  // out of that many; the questions after it are left out (including one you only opened before stopping).
  function reachedCount() {
    let r = 0;
    sq.forEach((s, n) => { if (s.pick !== null || s.skipped) r = n + 1; });
    return Math.max(1, r);
  }

  // Ask before marking when questions are still open.
  function confirmMark(auto) {
    const reach = reachedCount(), notReached = deck.length - reach;
    const open = sq.slice(0, reach).map((s, n) => (s.pick === null ? n : -1)).filter(n => n >= 0);
    if (!open.length && notReached && !auto) {
      const box = el("div", { className: "card mark-ask" });
      box.append(el("p", { className: "q" }, `You got up to question ${reach} of ${deck.length}`),
        el("p", { className: "sub" }, `Marking now scores you out of ${reach}. The ${plural(notReached, "question")} after it that you haven't reached won't count.`));
      const r = el("div", { className: "row" });
      const go = el("button", { className: "btn" }, `Mark out of ${reach}`), back = el("button", { className: "btn ghost" }, `Keep going (question ${reach + 1})`);
      go.onclick = () => markSet();
      back.onclick = () => { i = reach; qEnter = timeMs(); show("fwd"); };
      r.append(go, back); box.append(r);
      screen("up"); app.append(topbar(), box);
      return;
    }
    if (!open.length) {
      if (auto) { // finished the last one: offer a chance to look back first
        const box = el("div", { className: "card mark-ask" });
        box.append(el("p", { className: "q" }, "All questions answered."), el("p", { className: "sub" }, "Mark the set now, or go back and check your answers first."));
        const r = el("div", { className: "row" });
        const go = el("button", { className: "btn" }, "Mark the question set"), back = el("button", { className: "btn ghost" }, "Review answers");
        go.onclick = () => markSet();
        back.onclick = () => { qEnter = timeMs(); show("back"); };
        r.append(go, back); box.append(r);
        screen("up"); app.append(topbar(), box);
        return;
      }
      return markSet();
    }
    const box = el("div", { className: "card mark-ask" });
    box.append(el("p", { className: "q" }, `${plural(open.length, "question")} not answered yet`),
      el("p", { className: "sub" }, `Unanswered: ${open.map(n => n + 1).join(", ")}. If you mark now they count as incorrect.` +
        (notReached ? ` You got up to question ${reach}, so you'll be marked out of ${reach}; the ${plural(notReached, "question")} after it won't count.` : "")));
    const r = el("div", { className: "row" });
    const back = el("button", { className: "btn" }, `Go to question ${open[0] + 1}`), go = el("button", { className: "btn ghost" }, "Mark anyway");
    back.onclick = () => { i = open[0]; qEnter = timeMs(); show("back"); };
    go.onclick = () => markSet();
    r.append(back, go); box.append(r);
    screen("up"); app.append(topbar(), box);
  }

  // Mark everything at once, then show the score and every question with its answer.
  function markSet() {
    score = 0; missed = [];
    const reach = reachedCount(), counted = deck.slice(0, reach), notReached = deck.length - reach;
    counted.forEach((q, n) => {
      const ok = sq[n].pick === q.answer;
      if (ok) score++; else missed.push(q);
      record(q, ok);
    });
    endQuiz(() => {});
    const total = timeMs();
    if (trackSet) { ptLogQuick(score, reach); trackSet = false; }
    screen("up");
    const card = el("div", { className: "card" });
    card.append(el("p", { className: "kicker" }, notReached ? `Marked early · got up to question ${reach} of ${deck.length}` : "Results"), el("p", { className: "score" }, `${score} / ${reach}`));
    if (!reviewMode && deck.length) card.append(el("p", { className: "sub", style: "margin:0 0 6px" }, "Added to today's \u201cDaily quick questions\u201d on the progression tracker."));
    const unanswered = sq.slice(0, reach).filter(s => s.pick === null).length;
    card.append(el("p", { className: "sub", style: "margin-bottom:6px" }, `${Math.round(score / reach * 100)}% correct${unanswered ? ` · ${unanswered} left unanswered` : ""}${notReached ? ` · ${notReached} not reached (not counted)` : ""}`));
    card.append(el("p", { className: "sub" }, `⏱ ${fmt(total)} total · ${fmt(total / reach)} per question on average`));
    card.append(el("p", { className: "sub", style: "margin-top:12px" }, reviewMode
      ? `${plural(score, "question")} you got right left your incorrect questions. ${wrongList().length} still there.`
      : missed.length ? `${missed.length} added to your incorrect questions.` : "Nothing new for your incorrect questions."));
    const row = el("div", { className: "row" });
    if (missed.length) { const retry = el("button", { className: "btn" }, "Retry missed"); retry.onclick = () => begin(shuffle(missed), reviewMode); row.append(retry); }
    const nb = el("button", { className: "btn ghost", disabled: !wrongList().length }, "Incorrect questions");
    nb.onclick = () => notes();
    const again = el("button", { className: "btn ghost" }, "Start over");
    again.onclick = () => backTo();
    const menu = el("button", { className: "btn ghost" }, "Menu");
    menu.onclick = () => home("back");
    row.append(nb, again, menu);
    card.append(row);
    app.append(card);
    // Every question you reached, in order: your answer, the correct one, the explanation and the time you spent.
    counted.forEach((q, n) => {
      const s = sq[n], ok = s.pick === q.answer;
      const c = el("div", { className: "card review-q" });
      const meta = el("div", { className: "meta" });
      meta.append(el("span", {}, `${n + 1}. ${qLabel(q)}`), el("span", { className: ok ? "ok" : "bad" }, `${ok ? "✓ Correct" : s.pick === null ? "– Not answered" : "✗ Incorrect"} · ${fmt(s.ms)}`));
      c.append(meta, el("p", { className: "q" }, q.q));
      s.order.forEach((k, pos) => {
        const o = el("div", { className: "opt static" + (k === q.answer ? " correct" : k === s.pick ? " wrong" : "") }, `${LETTERS[pos]}. ${q.options[k]}`);
        c.append(o);
      });
      c.append(el("div", { className: "why" }, q.why));
      app.append(c);
    });
  }

  // Vignette flow: the case and its exhibits on top, its questions below, Next at the bottom.
  function beginExam(vs) {
    flow = "vignette"; vdeck = vs; vi = 0; vscores = [];
    deck = vs.flatMap(v => v.questions); reviewMode = false;
    startRun();
    showVignette();
  }

  function showVignette() {
    const v = vdeck[vi];
    checkedCurrent = false;
    screen("fwd");
    const quiz = el("div", { id: "quiz" });

    const vcard = el("div", { className: "card" });
    const meta = el("div", { className: "meta" });
    meta.append(el("span", {}, `Vignette ${vi + 1} of ${vdeck.length}`), el("span", {}, `${v.topic} · Score ${score}`));
    const body = renderBody(v);
    body.prepend(el("h2", {}, v.title));
    vcard.append(meta, body);
    quiz.append(topbar(), progress(vi / vdeck.length), vcard);

    const chosen = new Array(v.questions.length).fill(null);
    const status = el("p", { className: "status" });
    const check = el("button", { className: "btn" }, "Check answers");
    const updateStatus = () => {
      const n = chosen.filter(c => c !== null).length;
      status.textContent = `${n} of ${v.questions.length} answered`;
      check.disabled = n < v.questions.length;
    };

    const qcards = v.questions.map((q, qi) => {
      const card = el("div", { className: "card" });
      card.append(el("div", { className: "meta" }, `Question ${q.num}`), el("p", { className: "q" }, q.q));
      const buttons = q.options.map((text, k) => {
        const b = el("button", { className: "opt" }, `${LETTERS[k]}. ${text}`);
        b.onclick = () => {
          chosen[qi] = k;
          buttons.forEach((x, kk) => x.classList.toggle("sel", kk === k));
          updateStatus();
        };
        card.append(b);
        return b;
      });
      quiz.append(card);
      return { card, buttons };
    });

    const bottom = el("div", { className: "card" });
    const row = el("div", { className: "row", style: "margin:12px 0 0" });
    row.append(check);
    bottom.append(status, row);
    quiz.append(bottom);
    updateStatus();

    check.onclick = () => {
      checkedCurrent = true;
      let right = 0;
      v.questions.forEach((q, qi) => {
        const { card, buttons } = qcards[qi], k = chosen[qi];
        buttons.forEach(b => { b.disabled = true; b.classList.remove("sel"); });
        buttons[q.answer].classList.add("correct");
        if (k === q.answer) { right++; score++; }
        else { buttons[k].classList.add("wrong"); missed.push(q); }
        record(q, k === q.answer);
        card.append(el("div", { className: "why" }, q.why));
      });
      vscores.push({ title: v.title, right, total: v.questions.length });
      status.textContent = `${right} / ${v.questions.length} correct on this set · Score ${score} / ${answeredCount()}`;
      row.innerHTML = "";
      const last = vi + 1 >= vdeck.length;
      const next = el("button", { className: "btn" }, last ? "See results" : "Next vignette →");
      next.onclick = () => { vi++; last ? results() : showVignette(); };
      row.append(next);
    };
    app.append(quiz);
  }

  function results(answered = deck.length) {
    endQuiz(() => {});
    const total = timeMs();
    screen("up");
    const card = el("div", { className: "card" });
    card.append(el("p", { className: "kicker" }, answered < deck.length ? `Quit early · ${answered} of ${deck.length} answered` : "Results"));
    card.append(el("p", { className: "score" }, `${score} / ${answered}`));
    const pct = Math.round((score / answered) * 100);
    card.append(el("p", { className: "sub", style: "margin-bottom:6px" }, `${pct}% correct`));
    card.append(el("p", { className: "sub" }, `⏱ ${fmt(total)} total · ${fmt(total / answered)} per question`));
    if (flow === "vignette" && vscores.length) {
      const ul = el("ul", { className: "miss" });
      vscores.forEach(s => ul.append(el("li", {}, `${s.title}: ${s.right} / ${s.total}`)));
      card.append(ul);
    }
    card.append(el("p", { className: "sub", style: "margin-top:12px" }, reviewMode
      ? `${plural(score, "question")} you got right left your incorrect questions. ${wrongList().length} still there.`
      : missed.length ? `${missed.length} added to your incorrect questions.` : "Nothing new for your incorrect questions."));
    if (missed.length) {
      card.append(el("p", { className: "q" }, "Review what you missed:"));
      const ul = el("ul", { className: "miss" });
      missed.forEach(q => ul.append(el("li", {}, `${q.vignette ? `Q${q.num}. ` : ""}${q.q} → ${q.vignette ? LETTERS[q.answer] + ". " : ""}${q.options[q.answer]}`)));
      card.append(ul);
    }
    const row = el("div", { className: "row" });
    if (missed.length) {
      const retry = el("button", { className: "btn" }, "Retry missed");
      retry.onclick = () => begin(shuffle(missed), reviewMode);
      row.append(retry);
    }
    const nb = el("button", { className: "btn ghost", disabled: !wrongList().length }, "Incorrect questions");
    nb.onclick = () => notes();
    const again = el("button", { className: "btn ghost" }, "Start over");
    again.onclick = () => backTo();
    const menu = el("button", { className: "btn ghost" }, "Menu");
    menu.onclick = () => home("back");
    row.append(nb, again, menu);
    card.append(row);
    app.append(card);
  }

  document.getElementById("ver").textContent = APP_VERSION;
  gardenSync(); // lock the trees of days that have ended
  // One-off fix: an 80-question custom set marked after reaching question 50 was scored out of 80 (the 30 questions
  // not reached counted as wrong). Re-score that day's "Daily quick questions" cell out of 50.
  (function fixEarlyMark() {
    const pr = loadPrefs();
    if (pr.fixedEarlyMark) return;
    const p = loadPT();
    for (const k of ["quick|2026-10-06", "quick|2026-10-07", "quick|2026-10-05"]) {
      const q = (p.cells[k] || []).find(m => m.t === "q" && m.n >= 80);
      if (q && q.n - 30 >= q.right) { q.n -= 30; q.s = Math.round(q.right / q.n * 100); savePT(p); break; }
    }
    savePrefs({ fixedEarlyMark: true });
  })();
  document.getElementById("brand").onclick = () => { if (!inQuiz) home("back"); };
  home("up");

  // Hold the splash until the loading bar finishes, then fade it out as the menu slides in.
  (function hideSplash() {
    const splash = document.getElementById("splash");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const wait = Math.max(0, (reduce ? 400 : 3300) - performance.now()); // letters finish at ~2.6s, then a short hold
    setTimeout(() => {
      splash.classList.add("done");
      document.body.classList.remove("loading");
      setTimeout(() => splash.remove(), 1300);
    }, wait);
  })();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
